<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Springer-Dispo 14.0 QUERY FINAL</title>

<style>
:root{
--p:#007bff;
--s:#28a745;
--d:#dc3545;
--bg:#f4f7f6;
}

body{
font-family:Segoe UI,sans-serif;
background:var(--bg);
padding:20px;
color:#333;
}

.card{
background:#fff;
padding:25px;
border-radius:12px;
box-shadow:0 4px 15px rgba(0,0,0,.1);
max-width:700px;
margin:auto;
}

label{
display:block;
font-weight:bold;
font-size:.85rem;
margin-bottom:5px;
color:#666;
}

input,select{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:8px;
margin-bottom:15px;
box-sizing:border-box;
font-size:1rem;
}

.btn-main{
width:100%;
padding:16px;
background:var(--p);
color:#fff;
border:none;
border-radius:8px;
font-weight:bold;
cursor:pointer;
font-size:1.05rem;
}

.log-box{
background:#000;
color:#0f0;
padding:12px;
border-radius:8px;
font-family:monospace;
font-size:.8rem;
white-space:pre-wrap;
min-height:80px;
margin-bottom:20px;
}

.driver{
background:#fff;
padding:15px;
border-radius:10px;
margin-top:10px;
display:flex;
justify-content:space-between;
align-items:center;
border-left:8px solid #ccc;
box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.is-free{
border-left-color:var(--s)!important;
background:#fafffa;
}

.is-busy{
border-left-color:var(--d)!important;
background:#fff5f5;
}

.links{
text-align:center;
margin-top:18px;
font-size:.85rem;
}

.links a{
text-decoration:none;
margin:0 8px;
border:1px solid #ddd;
padding:5px 10px;
border-radius:5px;
color:var(--p);
}
</style>
</head>

<body>

<div class="card">

<h2 style="text-align:center;color:var(--p);margin-top:0;">
Springer-Dispo 14.0 QUERY FINAL
</h2>

<div id="statusLog" class="log-box">Status: Bereit.</div>

<label>Einrichtung wählen</label>
<select id="schoolSelect" onchange="document.getElementById('destPlz').value=this.value">
<option value="30655">Albert-Liebmann-Schule (30655)</option>
<option value="30165">Lebenshilfe Büttnerstraße (30165)</option>
<option value="30449">Wilhelm-Schade-Schule (30449)</option>
<option value="30853">Pestalozzi-Schule (30853)</option>
<option value="30880">Mecklenheide Forst (30880)</option>
<option value="30177">Test-Standort (30177)</option>
</select>

<label>Ziel-PLZ</label>
<input type="text" id="destPlz" value="30655">

<div style="display:flex;gap:10px;">
<div style="flex:1;">
<label>Von Datum</label>
<input type="date" id="dateFrom" value="2026-04-24">
</div>

<div style="flex:1;">
<label>Bis Datum</label>
<input type="date" id="dateTo" value="2026-04-24">
</div>
</div>

<button class="btn-main" onclick="run()">Verfügbarkeit & Ranking prüfen</button>

<div class="links">
<a href="#" onclick="setup()">⚙️ Setup</a>
<a href="https://cors-anywhere.herokuapp.com/corsdemo" target="_blank">🔓 Proxy</a>
</div>

</div>

<div id="results" style="max-width:700px;margin:20px auto;"></div>

<script>
const drivers = [
{name:"Türkel Tuncer",plz:"30161"},
{name:"Von Treskow Albrecht",plz:"30175"},
{name:"Otto Alexander",plz:"30173"},
{name:"Ferkau Eckart",plz:"30851"},
{name:"Ohm Lars",plz:"30559"},
{name:"Bachmeier Reinhard",plz:"30659"},
{name:"Isfahan Mozaffaey Hamid",plz:"30519"},
{name:"Schrader Harald",plz:"30880"},
{name:"Aschenbach André",plz:"30989"},
{name:"Neubauer Michael",plz:"30853"}
];

function setup(){
localStorage.setItem("kKey",prompt("Kalender.digital API-Key",localStorage.getItem("kKey")||""));
localStorage.setItem("kIds",prompt("Kalender-ID(s), komma getrennt",localStorage.getItem("kIds")||""));
localStorage.setItem("gKey",prompt("Google API Key",localStorage.getItem("gKey")||""));
location.reload();
}

function log(t){
document.getElementById("statusLog").textContent=t;
}

async function run(){

const kKey=localStorage.getItem("kKey");
const kIds=localStorage.getItem("kIds");
const gKey=localStorage.getItem("gKey");

if(!kKey || !kIds || !gKey){
alert("Bitte Setup ausfüllen.");
return;
}

const from=document.getElementById("dateFrom").value;
const to=document.getElementById("dateTo").value;
const dest=document.getElementById("destPlz").value;

try{

log("🛰️ Lade Google Maps...");
await ensureGoogle(gKey);

log("🗺️ Berechne Entfernungen...");
const matrix=await getMatrix(dest);

log("📅 Prüfe Fahrer einzeln über Query...");
let ranking=[];

for(let i=0;i<drivers.length;i++){

const d=drivers[i];

const busy=await checkBusyByQuery(d.name,from,to,kIds,kKey);

ranking.push({
...d,
isBusy:busy.found,
eventTitle:busy.title,
distText:matrix.rows[i].elements[0].distance.text,
distValue:matrix.rows[i].elements[0].distance.value
});

log("Prüfe: " + d.name);

}

ranking.sort((a,b)=>
(a.isBusy-b.isBusy) || (a.distValue-b.distValue)
);

render(ranking);

log("✅ Analyse abgeschlossen.");

}catch(e){
console.error(e);
log("❌ Fehler:\n"+e.message);
}

}

/* ==========================
QUERY PRÜFUNG
========================== */
async function checkBusyByQuery(driverName,from,to,kIds,kKey){

const ids=kIds.split(",");
const searchTerms=[
driverName,
driverName.split(" ").pop()
];

for(const rawId of ids){

const id=rawId.trim();

for(const term of searchTerms){

const url=
`https://api.kalender.digital/public/event?calendarId=${encodeURIComponent(id)}&startDate=${from}&endDate=${to}T23:59:59&timeZone=Europe/Berlin&query=${encodeURIComponent(term)}`;

const proxy=
"https://corsproxy.io/?"+encodeURIComponent(url);

const resp=await fetch(proxy,{
headers:{
"X-API-KEY":kKey.trim()
}
});

if(!resp.ok) continue;

const data=await resp.json();

let events=[];

if(Array.isArray(data)) events=data;
else if(Array.isArray(data.events)) events=data.events;

if(events.length>0){

return {
found:true,
title:events[0].title || "Termin"
};

}

}

}

return {
found:false,
title:""
};

}

/* ==========================
GOOGLE
========================== */
function ensureGoogle(key){

return new Promise(resolve=>{

if(typeof google!=="undefined"){
resolve();
return;
}

const s=document.createElement("script");
s.src=`https://maps.googleapis.com/maps/api/js?key=${key}`;
s.onload=resolve;
document.head.appendChild(s);

});

}

function getMatrix(dest){

return new Promise((resolve,reject)=>{

const service=new google.maps.DistanceMatrixService();

service.getDistanceMatrix({
origins:drivers.map(d=>d.plz),
destinations:[dest],
travelMode:"DRIVING"
},(response,status)=>{

if(status!=="OK"){
reject(new Error("Google Maps Fehler"));
return;
}

resolve(response);

});

});

}

/* ==========================
RENDER
========================== */
function render(list){

document.getElementById("results").innerHTML=
list.map(d=>`

<div class="driver ${d.isBusy?'is-busy':'is-free'}">

<div>
<strong style="font-size:1.05rem;">${d.name}</strong><br>
<span style="color:#666;">Entfernung: ${d.distText}</span>
${d.isBusy ? `<br><small style="color:var(--d);font-weight:bold;">${d.eventTitle}</small>` : ""}
</div>

<div>
<span style="
padding:5px 10px;
border-radius:5px;
font-weight:bold;
color:#fff;
background:${d.isBusy?'var(--d)':'var(--s)'};
">
${d.isBusy ? "BESETZT" : "FREI"}
</span>
</div>

</div>

`).join("");

}
</script>

</body>
</html>
