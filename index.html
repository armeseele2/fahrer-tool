<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Springer-Dispo 15.0 PROFI</title>

<style>
body{font-family:Segoe UI;background:#f4f7f6;padding:20px}
.card{max-width:800px;margin:auto;background:#fff;padding:20px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.1)}
.driver{display:flex;justify-content:space-between;padding:12px;margin-top:10px;border-left:6px solid #ccc;background:#fff;border-radius:8px}
.free{border-left-color:#28a745}
.busy{border-left-color:#dc3545;background:#fff5f5}
button{padding:8px 12px;border:none;border-radius:6px;cursor:pointer}
.book{background:#28a745;color:#fff}
h2{text-align:center}
input,select{width:100%;padding:10px;margin:6px 0}
</style>
</head>

<body>

<div class="card">

<h2>Springer-Dispo 15.0 PROFI</h2>

<label>Einrichtung</label>
<select id="school">
<option value="Albert Liebmann Schule">Albert Liebmann Schule</option>
<option value="Wilhelm Schade Schule">Wilhelm Schade Schule</option>
<option value="Pestalozzi Schule">Pestalozzi Schule</option>
</select>

<label>Datum</label>
<input type="date" id="date">

<label>Uhrzeit von</label>
<input type="time" id="start">

<label>Uhrzeit bis</label>
<input type="time" id="end">

<label>Tour / Beschreibung</label>
<input type="text" id="desc" placeholder="z.B. Hin / Rücktour">

<button onclick="loadData()">Fahrer prüfen</button>

<div id="out"></div>

</div>

<script>

const drivers=[
"Türkel Tuncer",
"Von Treskow Albrecht",
"Otto Alexander",
"Ferkau Eckart",
"Ohm Lars",
"Bachmeier Reinhard",
"Isfahan Hamid",
"Schrader Harald",
"Aschenbach André",
"Neubauer Michael"
];

let events=[];

/* ================= LOAD ================= */
async function loadData(){

const date=document.getElementById("date").value;

const kKey=localStorage.getItem("kKey");
const kIds=localStorage.getItem("kIds");

events=[];

for(let id of kIds.split(",")){

const url=`https://api.kalender.digital/public/event?calendarId=${id}&startDate=${date}&endDate=${date}T23:59:59&timeZone=Europe/Berlin`;

const proxy="https://corsproxy.io/?"+encodeURIComponent(url);

const r=await fetch(proxy,{
headers:{"X-API-KEY":kKey}
});

const data=await r.json();

if(Array.isArray(data)) events.push(...data);
else if(Array.isArray(data.events)) events.push(...data.events);
}

render();

}

/* ================= CHECK ================= */
function isBusy(name){

const n=name.toLowerCase();

return events.some(e=>{

const text=JSON.stringify(e).toLowerCase();
return text.includes(n);

});

}

/* ================= RENDER ================= */
function render(){

const out=document.getElementById("out");
out.innerHTML="";

drivers.forEach(d=>{

const busy=isBusy(d);

out.innerHTML+=`
<div class="driver ${busy?'busy':'free'}">
<div>
<b>${d}</b><br>
${busy?'BESETZT':'FREI'}
</div>

<div>
${!busy?`<button class="book" onclick="book('${d}')">JETZT EINSETZEN</button>`:''}
</div>
</div>
`;

});

}

/* ================= BOOK ================= */
async function book(driver){

const school=document.getElementById("school").value;
const date=document.getElementById("date").value;
const start=document.getElementById("start").value;
const end=document.getElementById("end").value;
const desc=document.getElementById("desc").value;

const kKey=localStorage.getItem("kKey");
const kIds=localStorage.getItem("kIds");

const payload={
startDate:`${date} ${start}:00`,
endDate:`${date} ${end}:00`,
timeZone:"Europe/Berlin",
title:school,
description:desc,
who:"",
where:"",
wholeDay:false,
subCalendars:[driver],
links:[]
};

for(let id of kIds.split(",")){

await fetch("https://api.kalender.digital/public/event",{
method:"POST",
headers:{
"Content-Type":"application/json",
"X-API-KEY":kKey
},
body:JSON.stringify(payload)
});

}

alert("Gebucht: " + driver);
loadData();

}

</script>

</body>
</html>
