<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Springer-Dispo 6.5</title>
    <style>
        :root { --p: #007bff; --s: #28a745; --d: #dc3545; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        label { display: block; margin: 10px 0 5px; font-weight: bold; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 10px; box-sizing: border-box; }
        .btn-main { width: 100%; padding: 16px; background: var(--p); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; }
        .log-box { background: #000; color: #0f0; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 0.8rem; margin-bottom: 15px; white-space: pre-wrap; }
        .driver { background: white; padding: 15px; border-radius: 10px; margin-top: 10px; display: flex; justify-content: space-between; border-left: 6px solid #ccc; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .is-busy { border-left-color: var(--d); }
        .is-free { border-left-color: var(--s); }
    </style>
</head>
<body>

<div class="card">
    <h2 style="text-align:center; color:var(--p); margin-top:0;">Springer-Dispo 6.5</h2>
    
    <div id="statusLog" class="log-box">Status: Bereit</div>

    <label>Ziel-Einrichtung</label>
    <select id="schoolSelect" onchange="document.getElementById('destPlz').value = this.value">
        <option value="">-- Bitte wählen --</option>
        <option value="30655">Albert-Liebmann-Schule (30655)</option>
        <option value="30165">Lebenshilfe Büttnerstraße (30165)</option>
        <option value="30449">Wilhelm-Schade-Schule (30449)</option>
        <option value="30900">Kindergarten Domino (30900)</option>
        <option value="30177">Test-Standort (30177)</option>
    </select>
    <input type="text" id="destPlz" value="30177">

    <div style="display:flex; gap:10px;">
        <div style="flex:1;"><label>Von</label><input type="date" id="dateFrom" value="2026-04-24"></div>
        <div style="flex:1;"><label>Bis</label><input type="date" id="dateTo" value="2026-04-24"></div>
    </div>

    <button class="btn-main" onclick="run()">Verfügbarkeit & Ranking prüfen</button>
    <p style="text-align:center;"><small><a href="#" onclick="setup()" style="color:#888;">⚙️ API-Keys & Kalender-ID verwalten</a></small></p>
</div>

<div id="results" style="max-width: 600px; margin: 20px auto;"></div>

<script>
    const drivers = [
        { name: "Türkel Tuncer", plz: "30161" }, { name: "Von Treskow Albrecht", plz: "30175" },
        { name: "Otto Alexander", plz: "30173" }, { name: "Ferkau Eckart", plz: "30851" },
        { name: "Ohm Lars", plz: "30559" }, { name: "Bachmeier Reinhard", plz: "30659" },
        { name: "Isfahan Mozaffaey Hamid", plz: "30519" }, { name: "Schrader Harald", plz: "30880" },
        { name: "Aschenbach André", plz: "30989" }, { name: "Neubauer Michael", plz: "30853" }
    ];

    function setup() {
        localStorage.setItem('kKey', prompt("1. X-API-KEY:", localStorage.getItem('kKey') || ""));
        localStorage.setItem('kId', prompt("2. Kalender-ID (NUR EINE zum Testen!):", localStorage.getItem('kId') || ""));
        localStorage.setItem('gKey', prompt("3. Google API Key:", localStorage.getItem('gKey') || ""));
        location.reload();
    }

    async function run() {
        const kKey = localStorage.getItem('kKey'), kId = localStorage.getItem('kId'), gKey = localStorage.getItem('gKey');
        const from = document.getElementById('dateFrom').value, to = document.getElementById('dateTo').value;
        const log = document.getElementById('statusLog');
        const resDiv = document.getElementById('results');

        if(!kKey || !kId) { alert("Bitte Setup ausfüllen!"); return; }
        log.innerHTML = "📡 Starte Abfrage...";

        try {
            // Wir nutzen jetzt wieder die Kalender-ID, da "0 Termine" oft an fehlender ID liegt
            const apiUrl = `https://api.kalender.digital/public/event?calendarId=${kId}&startDate=${from}&endDate=${to}&timeZone=Europe/Berlin`;
            
            // NEUER PROXY: ThingProxy ist oft stabiler für API-Header
            const proxyUrl = `https://thingproxy.freeboard.io/fetch/${apiUrl}`;
            
            const resp = await fetch(proxyUrl, {
                method: 'GET',
                headers: { 'X-API-KEY': kKey.trim() }
            });

            const data = await resp.json();
            const events = data.events || [];
            log.innerHTML = `✅ Verbindung steht!\nEvents gefunden: ${events.length}`;

            const service = new google.maps.DistanceMatrixService();
            service.getDistanceMatrix({
                origins: drivers.map(d => d.plz),
                destinations: [document.getElementById('destPlz').value],
                travelMode: 'DRIVING'
            }, (mResp, status) => {
                let ranking = drivers.map((d, i) => {
                    const lastName = d.name.split(' ').pop().toLowerCase();
                    const isBusy = events.some(ev => JSON.stringify(ev).toLowerCase().includes(lastName));
                    const dist = mResp.rows[i].elements[0].distance.text;
                    const val = mResp.rows[i].elements[0].distance.value;
                    return { ...d, distT: dist, distV: val, isBusy };
                });

                ranking.sort((a,b) => a.isBusy - b.isBusy || a.distV - b.distV);
                resDiv.innerHTML = "";
                ranking.forEach(d => {
                    resDiv.innerHTML += `<div class="driver ${d.isBusy ? 'is-busy' : 'is-free'}">
                        <div><strong>${d.name}</strong><br><small>${d.distT} entfernt</small></div>
                        <span style="font-weight:bold">${d.isBusy ? '🔴 BESETZT' : '🟢 FREI'}</span>
                    </div>`;
                });
            });
        } catch(e) { log.innerHTML = "❌ Fehler: " + e.message; }
    }

    (function() {
        const key = localStorage.getItem('gKey');
        if(key) {
            const s = document.createElement('script');
            s.src = `https://maps.googleapis.com/maps/api/js?key=${key}`;
            document.head.appendChild(s);
        }
    })();
</script>
</body>
</html>
