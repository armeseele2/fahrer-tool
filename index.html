<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Springer-Dispo 3.1 (Deep Scan Mode)</title>
    <style>
        :root { --primary: #007bff; --success: #28a745; --danger: #dc3545; --bg: #f4f7f6; }
        body { font-family: sans-serif; background: var(--bg); padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; }
        button { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .driver-row { background: white; padding: 15px; border-radius: 8px; margin-top: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid #ddd; }
        .is-free { border-left-color: var(--success); }
        .is-busy { border-left-color: var(--danger); opacity: 0.7; background: #fff5f5; }
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
        .free { background: #d4edda; color: #155724; }
        .busy { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="card">
    <h2>Springer-Dispo 3.1 🚀</h2>
    <label>Ziel-PLZ</label>
    <input type="text" id="destinationPlz" value="30177">
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        <input type="date" id="startDate">
        <input type="date" id="endDate">
    </div>
    <button onclick="generateRanking()">Kalender Deep-Scan starten</button>
    <button style="margin-top:10px; background:#6c757d; font-size:0.7rem;" onclick="setupAdmin()">⚙️ API-Daten prüfen</button>
</div>

<div id="results"></div>

<script>
    const drivers = [
        { name: "Bachmeier Reinhard", plz: "30659" },
        { name: "Türkel Tuncer", plz: "30161" },
        { name: "Isfahan Mozaffaey Hamid", plz: "30519" },
        { name: "Otto Alexander", plz: "30173" },
        { name: "Schrader Harald", plz: "30880" },
        { name: "Aschenbach André", plz: "30989" },
        { name: "Ohm Lars", plz: "30559" }
    ];

    document.getElementById('startDate').value = "2026-04-24";
    document.getElementById('endDate').value = "2026-04-24";

    function setupAdmin() {
        localStorage.setItem('kalender_id', prompt("Kalender-ID:", localStorage.getItem('kalender_id') || ""));
        localStorage.setItem('kalender_key', prompt("Admin-API-Key:", localStorage.getItem('kalender_key') || ""));
        localStorage.setItem('google_key', prompt("Google Maps Key:", localStorage.getItem('google_key') || ""));
        location.reload();
    }

    async function generateRanking() {
        const kId = localStorage.getItem('kalender_id');
        const kKey = localStorage.getItem('kalender_key');
        const start = document.getElementById('startDate').value;
        const end = document.getElementById('endDate').value;
        const resDiv = document.getElementById('results');
        resDiv.innerHTML = "Durchsuche alle Unterkalender...";

        try {
            // WICHTIG: Wir hängen &includeSubcalendars=1 an, damit die API ALLES schickt
            const kUrl = `https://corsproxy.io/?${encodeURIComponent(`https://api.kalender.digital/public/event?calendarId=${kId}&startDate=${start}&endDate=${end}&includeSubcalendars=1`)}`;
            const resp = await fetch(kUrl, { headers: { 'X-API-KEY': kKey } });
            const data = await resp.json();
            
            // Wir erstellen eine Liste aller Namen, die heute irgendwo einen Termin haben
            const bookedNames = (data.events || []).map(e => 
                (e.title + " " + (e.subcalendarName || "")).toLowerCase()
            );

            // Google Maps Abfrage
            const service = new google.maps.DistanceMatrixService();
            service.getDistanceMatrix({
                origins: drivers.map(d => d.plz),
                destinations: [document.getElementById('destinationPlz').value],
                travelMode: 'DRIVING'
            }, (mResp, status) => {
                let ranking = drivers.map((d, i) => {
                    const lastName = d.name.split(' ')[0].toLowerCase();
                    // Prüfen, ob der Nachname in irgendeinem gebuchten Termin vorkommt
                    const isBusy = bookedNames.some(b => b.includes(lastName));
                    return { ...d, dist: mResp.rows[i].elements[0].distance.text, isBusy };
                });

                ranking.sort((a,b) => a.isBusy - b.isBusy);
                resDiv.innerHTML = "";
                ranking.forEach(d => {
                    resDiv.innerHTML += `
                        <div class="driver-row ${d.isBusy ? 'is-busy' : 'is-free'}">
                            <div><strong>${d.name}</strong><br><small>${d.dist}</small></div>
                            <span class="status-badge ${d.isBusy ? 'busy' : 'free'}">${d.isBusy ? 'BESETZT' : 'FREI'}</span>
                        </div>`;
                });
            });
        } catch(e) { resDiv.innerHTML = "Fehler!"; }
    }
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=DEIN_GOOGLE_KEY&libraries=geometry"></script>
</body>
</html>
