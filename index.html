<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Springer-Dispo-Zentrale 3.6 🚀</title>
    <style>
        :root { --primary: #007bff; --success: #28a745; --danger: #dc3545; --bg: #f4f7f6; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 650px; margin: auto; }
        h2 { margin-top: 0; color: var(--primary); text-align: center; font-size: 1.5rem; }
        label { display: block; margin: 12px 0 5px; font-weight: bold; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn-main { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; margin-top: 20px; cursor: pointer; }
        .driver-card { background: white; padding: 18px; border-radius: 10px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border-left: 6px solid #ccc; }
        .is-free { border-left-color: var(--success); }
        .is-busy { border-left-color: var(--danger); background: #fff5f5; }
        .status-badge { padding: 5px 10px; border-radius: 5px; font-weight: bold; }
        .free-badge { background: #d4edda; color: #155724; }
        .busy-badge { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="card">
    <h2>Springer-Dispo-Zentrale 3.6</h2>
    <label>Ziel-PLZ</label>
    <input type="text" id="destinationPlz" value="30177">
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
        <div><label>Einsatz von</label><input type="date" id="startDate"></div>
        <div><label>Einsatz bis</label><input type="date" id="endDate"></div>
    </div>
    <button class="btn-main" onclick="checkAvailability()">Doku-konforme Abfrage starten</button>
</div>

<div id="results" style="max-width: 650px; margin: 25px auto;"></div>

<script>
    const drivers = [
        { name: "Bachmeier Reinhard", plz: "30659" },
        { name: "Türkel Tuncer", plz: "30161" },
        { name: "Isfahan Mozaffaey Hamid", plz: "30519" },
        { name: "Otto Alexander", plz: "30173" },
        { name: "Schrader Harald", plz: "30880" },
        { name: "Aschenbach André", plz: "30989" },
        { name: "Von Treskow Albrecht", plz: "30175" }
    ];

    document.getElementById('startDate').value = "2026-04-24";
    document.getElementById('endDate').value = "2026-04-24";

    async function checkAvailability() {
        const kId = localStorage.getItem('kalender_id');
        const kKey = localStorage.getItem('kalender_key');
        const gKey = localStorage.getItem('google_key');
        const start = document.getElementById('startDate').value;
        const end = document.getElementById('endDate').value;
        const dest = document.getElementById('destinationPlz').value;
        const resDiv = document.getElementById('results');

        if(!kKey || !kId) { alert("Bitte API-Daten prüfen!"); return; }
        resDiv.innerHTML = "Analysiere Kalenderdaten gemäß Dokumentation...";

        try {
            // Wir nutzen genau das Format aus dem Screenshot
            const kUrl = `https://corsproxy.io/?${encodeURIComponent(`https://api.kalender.digital/public/event?calendarId=${kId}&startDate=${start}&endDate=${end}&includeSubcalendars=1`)}`;
            
            const response = await fetch(kUrl, {
                method: 'GET',
                headers: { 'X-API-KEY': kKey, 'Accept': 'application/json' }
            });
            
            const data = await response.json();
            // Wir ziehen alle Titel und Beschreibungen in einen Vergleichs-String
            const allEventsString = JSON.stringify(data).toLowerCase();

            const service = new google.maps.DistanceMatrixService();
            service.getDistanceMatrix({
                origins: drivers.map(d => d.plz),
                destinations: [dest],
                travelMode: 'DRIVING'
            }, (mResp, status) => {
                let ranking = drivers.map((d, i) => {
                    const lastName = d.name.split(' ')[0].toLowerCase();
                    // Wir suchen nach dem Nachnamen im gesamten Doku-Antwort-Paket
                    const isBusy = allEventsString.includes(lastName);
                    const dist = mResp.rows[i].elements[0].distance.text;
                    const val = mResp.rows[i].elements[0].distance.value;
                    return { ...d, dist, val, isBusy };
                });

                ranking.sort((a,b) => a.isBusy - b.isBusy || a.val - b.val);

                resDiv.innerHTML = "";
                ranking.forEach(d => {
                    resDiv.innerHTML += `
                        <div class="driver-card ${d.isBusy ? 'is-busy' : 'is-free'}">
                            <div><strong>${d.name}</strong><br><small>${d.dist}</small></div>
                            <span class="status-badge ${d.isBusy ? 'busy-badge' : 'free-badge'}">
                                ${d.isBusy ? 'BESETZT' : 'FREI'}
                            </span>
                        </div>`;
                });
            });
        } catch(e) { resDiv.innerHTML = "Fehler beim API-Abgleich!"; }
    }
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=DEIN_GOOGLE_KEY&libraries=geometry"></script>
</body>
</html>
