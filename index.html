<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Springer-Dispo-Zentrale 4.0 🚀</title>
    <style>
        :root { --primary: #007bff; --success: #28a745; --danger: #dc3545; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        h2 { color: var(--primary); text-align: center; margin-bottom: 20px; }
        label { display: block; margin: 12px 0 5px; font-weight: bold; font-size: 0.9rem; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        .btn-main { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 20px; font-size: 1.1rem; }
        .settings-link { display: block; text-align: center; margin-top: 15px; color: #888; font-size: 0.8rem; text-decoration: none; cursor: pointer; }
        
        #results { max-width: 600px; margin: 25px auto; }
        .driver-card { background: white; padding: 18px; border-radius: 10px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border-left: 6px solid #ccc; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .is-free { border-left-color: var(--success); }
        .is-busy { border-left-color: var(--danger); background: #fff5f5; opacity: 0.8; }
        .status-badge { padding: 5px 10px; border-radius: 5px; font-weight: bold; font-size: 0.85rem; }
        .free { background: #d4edda; color: #155724; }
        .busy { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="card">
    <h2>Springer-Dispo 4.0</h2>
    
    <label>Ziel-PLZ (Einrichtung)</label>
    <input type="text" id="destinationPlz" placeholder="z.B. 30177" value="30177">

    <div style="display:flex; gap:10px;">
        <div style="flex:1;"><label>Datum</label><input type="date" id="checkDate"></div>
    </div>

    <button class="btn-main" onclick="runDispoCheck()">Verfügbarkeit prüfen</button>
    <a class="settings-link" onclick="openKeySetup()">⚙️ Schlüssel-Einstellungen (API & Google)</a>
</div>

<div id="results"></div>

<script>
    const drivers = [
        { name: "Bachmeier Reinhard", plz: "30659" },
        { name: "Türkel Tuncer", plz: "30161" },
        { name: "Isfahan Mozaffaey Hamid", plz: "30519" },
        { name: "Otto Alexander", plz: "30173" },
        { name: "Schrader Harald", plz: "30880" },
        { name: "Aschenbach André", plz: "30989" },
        { name: "Ohm Lars", plz: "30559" }
    ];

    document.getElementById('checkDate').value = "2026-04-24";

    function openKeySetup() {
        const kId = prompt("Kalender-ID (Nummer aus deinem Admin-Link):", localStorage.getItem('k_id') || "");
        const kKey = prompt("Kalender API-Key (von der API-Seite):", localStorage.getItem('k_key') || "");
        const gKey = prompt("Google Maps Key:", localStorage.getItem('g_key') || "");
        
        if(kId) localStorage.setItem('k_id', kId);
        if(kKey) localStorage.setItem('k_key', kKey);
        if(gKey) localStorage.setItem('g_key', gKey);
        location.reload();
    }

    // Google Maps Start
    (function loadGoogle() {
        const key = localStorage.getItem('g_key');
        if(key) {
            const s = document.createElement('script');
            s.src = `https://maps.googleapis.com/maps/api/js?key=${key}&libraries=geometry`;
            document.head.appendChild(s);
        }
    })();

    async function runDispoCheck() {
        const id = localStorage.getItem('k_id');
        const key = localStorage.getItem('k_key');
        const date = document.getElementById('checkDate').value;
        const dest = document.getElementById('destinationPlz').value;
        const resDiv = document.getElementById('results');

        if(!id || !key) { alert("Bitte erst Schlüssel in den Einstellungen hinterlegen!"); return; }
        resDiv.innerHTML = "<p style='text-align:center;'>Kalender wird gescannt...</p>";

        try {
            // Abfrage exakt nach dem Doku-Bild (X-API-KEY Header)
            const url = `https://corsproxy.io/?${encodeURIComponent(`https://api.kalender.digital/public/event?calendarId=${id}&startDate=${date}&endDate=${date}&includeSubcalendars=1`)}`;
            const response = await fetch(url, { headers: { 'X-API-KEY': key, 'Accept': 'application/json' } });
            const data = await response.json();
            
            // Alles in einen String werfen, um Namen zu finden
            const masterString = JSON.stringify(data).toLowerCase();

            const service = new google.maps.DistanceMatrixService();
            service.getDistanceMatrix({
                origins: drivers.map(d => d.plz),
                destinations: [dest],
                travelMode: 'DRIVING'
            }, (mResp, status) => {
                if(status !== "OK") { resDiv.innerHTML = "Google Maps Fehler!"; return; }

                let ranking = drivers.map((d, i) => {
                    const lastName = d.name.split(' ')[0].toLowerCase();
                    const isBusy = masterString.includes(lastName);
                    const dist = mResp.rows[i].elements[0].distance.text;
                    const val = mResp.rows[i].elements[0].distance.value;
                    return { ...d, dist, val, isBusy };
                });

                ranking.sort((a,b) => a.isBusy - b.isBusy || a.val - b.val);

                resDiv.innerHTML = "";
                ranking.forEach(d => {
                    resDiv.innerHTML += `
                        <div class="driver-card ${d.isBusy ? 'is-busy' : 'is-free'}">
                            <div>
                                <strong>${d.name}</strong>
                                <small>${d.dist} Entfernung</small>
                            </div>
                            <span class="status-badge ${d.isBusy ? 'busy' : 'free'}">${d.isBusy ? 'BESETZT' : 'FREI'}</span>
                        </div>`;
                });
            });
        } catch(e) { resDiv.innerHTML = "Fehler bei der Abfrage. Schlüssel prüfen."; }
    }
</script>
</body>
</html>
