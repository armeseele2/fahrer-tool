<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Springer-Dispo 15.2 FINAL</title>

<style>
body{font-family:Segoe UI;background:#f4f7f6;padding:20px}
.card{max-width:700px;margin:auto;background:#fff;padding:20px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.1)}
.driver{display:flex;justify-content:space-between;padding:12px;margin-top:10px;border-left:6px solid #ccc;border-radius:8px}
.free{border-left-color:#28a745;background:#fafffa}
.busy{border-left-color:#dc3545;background:#fff5f5}
button{padding:6px 10px;border:none;border-radius:6px;cursor:pointer}
.book{background:#28a745;color:#fff}
</style>
</head>

<body>

<div class="card">

<h2>Springer-Dispo 15.2</h2>

<label>Ziel-PLZ</label>
<input id="dest" value="30655">

<label>Datum</label>
<input type="date" id="date" value="2026-04-24">

<button onclick="run()">Start</button>

<div id="out"></div>

</div>

<script>

const drivers=[
{name:"Türkel Tuncer",plz:"30161"},
{name:"Von Treskow Albrecht",plz:"30175"},
{name:"Otto Alexander",plz:"30173"},
{name:"Ferkau Eckart",plz:"30851"},
{name:"Ohm Lars",plz:"30559"},
{name:"Bachmeier Reinhard",plz:"30659"},
{name:"Isfahan Mozaffaey Hamid",plz:"30519"},
{name:"Schrader Harald",plz:"30880"},
{name:"Aschenbach André",plz:"30989"},
{name:"Neubauer Michael",plz:"30853"}
];

let events=[];

async function run(){

const date=document.getElementById("date").value;
const dest=document.getElementById("dest").value;

const kKey=localStorage.getItem("kKey");
const kIds=localStorage.getItem("kIds");
const gKey=localStorage.getItem("gKey");

events=[];

/* ========= 1. KALENDER LADEN ========= */
for(let id of kIds.split(",")){

const url=`https://api.kalender.digital/public/event?calendarId=${id}&startDate=${date}&endDate=${date}T23:59:59&timeZone=Europe/Berlin`;

const proxy="https://corsproxy.io/?"+encodeURIComponent(url);

const r=await fetch(proxy,{headers:{"X-API-KEY":kKey}});
const data=await r.json();

if(Array.isArray(data)) events.push(...data);
else if(Array.isArray(data.events)) events.push(...data.events);
}

/* ========= 2. GOOGLE LADEN ========= */
if(typeof google==="undefined"){
await new Promise(res=>{
const s=document.createElement("script");
s.src=`https://maps.googleapis.com/maps/api/js?key=${gKey}`;
s.onload=res;
document.head.appendChild(s);
});
}

/* ========= 3. DISTANZ ========= */
const service=new google.maps.DistanceMatrixService();

service.getDistanceMatrix({
origins:drivers.map(d=>d.plz),
destinations:[dest],
travelMode:"DRIVING"
},(resp,status)=>{

let list=drivers.map((d,i)=>{

const text=JSON.stringify(events).toLowerCase();
const name=d.name.toLowerCase();

const busy=text.includes(name);

return{
...d,
busy,
distText:resp.rows[i].elements[0].distance.text,
distVal:resp.rows[i].elements[0].distance.value
};

});

/* ========= 4. SORT ========= */
list.sort((a,b)=>
(a.busy - b.busy) || (a.distVal - b.distVal)
);

/* ========= 5. RENDER ========= */
document.getElementById("out").innerHTML=list.map(d=>`

<div class="driver ${d.busy?'busy':'free'}">

<div>
<b>${d.name}</b><br>
${d.distText}<br>
${d.busy?'BESETZT':'FREI'}
</div>

<div>
${!d.busy?`<button class="book" onclick="book('${d.name}')">BUCHEN</button>`:''}
</div>

</div>

`).join("");

});

}

/* ========= 6. BUCHEN ========= */
async function book(name){

const kKey=localStorage.getItem("kKey");

const payload={
startDate:document.getElementById("date").value+" 07:00:00",
endDate:document.getElementById("date").value+" 13:00:00",
timeZone:"Europe/Berlin",
title:"Einsatz",
description:"Automatisch gebucht",
subCalendars:[name],
wholeDay:false
};

await fetch("https://api.kalender.digital/public/event",{
method:"POST",
headers:{
"Content-Type":"application/json",
"X-API-KEY":kKey
},
body:JSON.stringify(payload)
});

alert("Gebucht: "+name);
run();

}

</script>

</body>
</html>
