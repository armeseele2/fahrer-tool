<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Springer-Dispo-Zentrale 4.1 🚀</title>
    <style>
        :root { --primary: #007bff; --success: #28a745; --danger: #dc3545; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        h2 { color: var(--primary); text-align: center; margin-bottom: 20px; }
        label { display: block; margin: 12px 0 5px; font-weight: bold; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        .btn-main { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 20px; font-size: 1.1rem; }
        
        #results { max-width: 600px; margin: 25px auto; }
        .driver-card { background: white; padding: 18px; border-radius: 10px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border-left: 6px solid #ccc; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .is-free { border-left-color: var(--success); }
        .is-busy { border-left-color: var(--danger); background: #fff5f5; opacity: 0.8; }
        .btn-book { background: var(--success); color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 5px; }
        .status-badge { padding: 5px 10px; border-radius: 5px; font-weight: bold; font-size: 0.85rem; }
        .free { background: #d4edda; color: #155724; }
        .busy { background: #f8d7da; color: #721c24; }
        .settings-btn { display: block; text-align: center; margin-top: 15px; color: #888; font-size: 0.8rem; text-decoration: none; cursor: pointer; }
    </style>
</head>
<body>

<div class="card">
    <h2>Springer-Dispo 4.1</h2>
    
    <label>Ziel-PLZ</label>
    <input type="text" id="destinationPlz" value="30177">

    <label>Datum</label>
    <input type="date" id="checkDate" value="2026-04-24">

    <button class="btn-main" onclick="checkAvailability()">Verfügbarkeit prüfen & Ranking</button>
    <a class="settings-btn" onclick="setupKeys()">⚙️ Nur 2 IDs hinterlegen: Kalender & Google</a>
</div>

<div id="results"></div>

<script>
    const drivers = [
        { name: "Bachmeier Reinhard", plz: "30659" },
        { name: "Türkel Tuncer", plz: "30161" },
        { name: "Isfahan Mozaffaey Hamid", plz: "30519" },
        { name: "Otto Alexander", plz: "30173" },
        { name: "Schrader Harald", plz: "30880" },
        { name: "Aschenbach André", plz: "30989" },
        { name: "Ohm Lars", plz: "30559" },
        { name: "Neubauer Michael", plz: "30853" }
    ];

    function setupKeys() {
        const kId = prompt("1. Kalender-ID (aus deinem Admin-Link):", localStorage.getItem('kId') || "");
        const gId = prompt("2. Google-ID (dein Google API Key):", localStorage.getItem('gId') || "");
        
        if(kId) localStorage.setItem('kId', kId);
        if(gId) localStorage.setItem('gId', gId);
        location.reload();
    }

    // Google Maps Initialisierung
    (function() {
        const gId = localStorage.getItem('gId');
        if(gId) {
            const s = document.createElement('script');
            s.src = `https://maps.googleapis.com/maps/api/js?key=${gId}&libraries=geometry`;
            document.head.appendChild(s);
        }
    })();

    async function checkAvailability() {
        const kId = localStorage.getItem('kId');
        const date = document.getElementById('checkDate').value;
        const dest = document.getElementById('destinationPlz').value;
        const resDiv = document.getElementById('results');

        if(!kId) { alert("Bitte erst die Kalender-ID in den Einstellungen eingeben!"); return; }
        resDiv.innerHTML = "Prüfe Daten...";

        try {
            // Wir nutzen die Kalender-ID direkt für die öffentliche Abfrage
            const url = `https://corsproxy.io/?${encodeURIComponent(`https://api.kalender.digital/public/event?calendarId=${kId}&startDate=${date}&endDate=${date}`)}`;
            const response = await fetch(url);
            const data = await response.json();
            const events = JSON.stringify(data).toLowerCase();

            const service = new google.maps.DistanceMatrixService();
            service.getDistanceMatrix({
                origins: drivers.map(d => d.plz),
                destinations: [dest],
                travelMode: 'DRIVING'
            }, (mResp, status) => {
                if(status !== "OK") { resDiv.innerHTML = "Fehler: Google-ID ungültig oder keine Antwort."; return; }

                let ranking = drivers.map((d, i) => {
                    const lastName = d.name.split(' ')[0].toLowerCase();
                    const isBusy = events.includes(lastName);
                    const dist = mResp.rows[i].elements[0].distance.text;
                    const val = mResp.rows[i].elements[0].distance.value;
                    return { ...d, dist, val, isBusy };
                });

                ranking.sort((a,b) => a.isBusy - b.isBusy || a.val - b.val);

                resDiv.innerHTML = "";
                ranking.forEach(d => {
                    resDiv.innerHTML += `
                        <div class="driver-card ${d.isBusy ? 'is-busy' : 'is-free'}">
                            <div>
                                <strong>${d.name}</strong><br>
                                <small>${d.dist} Entfernung</small><br>
                                ${!d.isBusy ? '<button class="btn-book" onclick="alert(\'Buchung für ' + d.name + ' gestartet\')">Jetzt buchen</button>' : ''}
                            </div>
                            <span class="status-badge ${d.isBusy ? 'busy' : 'free'}">${d.isBusy ? 'BESETZT' : 'FREI'}</span>
                        </div>`;
                });
            });
        } catch(e) { resDiv.innerHTML = "Fehler bei der Verbindung zum Kalender."; }
    }
</script>
</body>
</html>
