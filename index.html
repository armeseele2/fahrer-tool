<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Springer-Dispo Pro FINAL</title>

<style>
:root{
--blue:#2563eb;
--blue2:#1d4ed8;
--green:#16a34a;
--red:#dc2626;
--bg:#eef2f7;
--card:#ffffff;
--text:#111827;
--muted:#6b7280;
}

*{box-sizing:border-box;}

body{
margin:0;
padding:20px;
font-family:Arial,Helvetica,sans-serif;
background:linear-gradient(135deg,#eef2f7,#dde7f5);
color:var(--text);
}

.card{
max-width:860px;
margin:auto;
background:var(--card);
padding:24px;
border-radius:18px;
box-shadow:0 12px 30px rgba(0,0,0,.08);
}

h2{
margin:0 0 20px;
text-align:center;
color:var(--blue);
}

label{
display:block;
margin:12px 0 6px;
font-weight:700;
font-size:.92rem;
}

input,select,textarea{
width:100%;
padding:12px;
border:1px solid #dbe2ea;
border-radius:10px;
font-size:15px;
background:#fff;
}

textarea{resize:vertical;}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

button{
border:none;
border-radius:10px;
cursor:pointer;
font-weight:700;
transition:.2s;
}

button:hover{
transform:translateY(-1px);
opacity:.95;
}

.main-btn{
width:100%;
padding:15px;
margin-top:16px;
background:linear-gradient(135deg,var(--blue),var(--blue2));
color:#fff;
font-size:16px;
}

.setup-btn{
width:100%;
padding:11px;
margin-top:10px;
background:#e5e7eb;
}

.log{
margin-top:14px;
padding:12px;
border-radius:10px;
background:#0f172a;
color:#22c55e;
font-family:monospace;
font-size:13px;
min-height:46px;
white-space:pre-wrap;
}

#results{
max-width:860px;
margin:18px auto;
}

.driver{
background:#fff;
border-radius:14px;
padding:14px;
margin-bottom:10px;
display:flex;
justify-content:space-between;
align-items:center;
gap:12px;
box-shadow:0 8px 18px rgba(0,0,0,.05);
border-left:10px solid #d1d5db;
}

.driver.free{border-left-color:var(--green);}
.driver.busy{border-left-color:var(--red);}

.badge{
display:inline-block;
padding:5px 10px;
border-radius:999px;
font-size:12px;
font-weight:700;
color:#fff;
margin-top:6px;
}

.free-badge{background:var(--green);}
.busy-badge{background:var(--red);}

.book-btn{
background:var(--green);
color:#fff;
padding:10px 14px;
margin-top:8px;
}

.del-btn{
background:#fff;
color:var(--red);
border:1px solid #fecaca;
padding:8px 12px;
margin-top:8px;
}

.small{
font-size:13px;
color:var(--muted);
}

.inline{
display:flex;
align-items:center;
gap:8px;
margin-top:12px;
}

.inline input{
width:auto;
}

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
z-index:999;
justify-content:center;
align-items:center;
padding:20px;
}

.modal-box{
background:#fff;
width:100%;
max-width:520px;
border-radius:18px;
padding:22px;
box-shadow:0 18px 35px rgba(0,0,0,.18);
}

.modal-actions{
display:flex;
gap:10px;
margin-top:18px;
}

.modal-actions button{
flex:1;
padding:12px;
}

.cancel-btn{background:#e5e7eb;}
.save-btn{background:var(--blue);color:#fff;}

@media(max-width:700px){
.row{grid-template-columns:1fr;}
.driver{flex-direction:column;align-items:flex-start;}
}
</style>
</head>

<body>
