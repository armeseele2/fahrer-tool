<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Springer-Dispo-Zentrale 3.8 🚀</title>
    <style>
        :root { --primary: #007bff; --success: #28a745; --danger: #dc3545; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        h2 { color: var(--primary); text-align: center; margin-top: 0; }
        label { display: block; margin: 12px 0 5px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .btn-main { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; margin-top: 20px; cursor: pointer; }
        .driver-card { background: white; padding: 15px; border-radius: 10px; margin-top: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid #ccc; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .is-free { border-left-color: var(--success); }
        .is-busy { border-left-color: var(--danger); background: #fffafa; }
        .status-badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; }
        .free-badge { background: #e6f4ea; color: #1e7e34; }
        .busy-badge { background: #fce8e6; color: #d93025; }
        .btn-book { background: var(--success); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-top: 5px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Springer-Dispo-Zentrale 3.8</h2>
    <label>Ziel auswählen</label>
    <select id="schoolSelect" onchange="document.getElementById('destinationPlz').value = this.value">
        <option value="30655">Albert-Liebmann-Schule (30655)</option>
        <option value="30165">Lebenshilfe Büttnerstraße (30165)</option>
        <option value="30900">Kindergarten Domino (30900)</option>
    </select>
    <label>Ziel-PLZ</label>
    <input type="text" id="destinationPlz" value="30177">
    <div style="display:flex; gap:10px;">
        <div style="flex:1;"><label>Von</label><input type="date" id="startDate" value="2026-04-24"></div>
        <div style="flex:1;"><label>Bis</label><input type="date" id="endDate" value="2026-04-24"></div>
    </div>
    <button class="btn-main" onclick="runCheck()">Verfügbarkeit prüfen & Ranking</button>
    <p style="text-align:center; font-size:0.8rem;"><a href="#" onclick="setup()">API-Einstellungen</a></p>
</div>

<div id="results" style="max-width:600px; margin: 20px auto;"></div>

<script>
    const drivers = [
        { name: "Bachmeier Reinhard", plz: "30659" },
        { name: "Türkel Tuncer", plz: "30161" },
        { name: "Isfahan Mozaffaey Hamid", plz: "30519" },
        { name: "Otto Alexander", plz: "30173" },
        { name: "Schrader Harald", plz: "30880" }
    ];

    function setup() {
        localStorage.setItem('k_id', prompt("Kalender-ID:", localStorage.getItem('k_id')));
        localStorage.setItem('k_key', prompt("API-Key:", localStorage.getItem('k_key')));
        localStorage.setItem('g_key', prompt("Google-Key:", localStorage.getItem('g_key')));
        location.reload();
    }

    async function runCheck() {
        const id = localStorage.getItem('k_id'), key = localStorage.getItem('k_key'), gkey = localStorage.getItem('g_key');
        const start = document.getElementById('startDate').value, end = document.getElementById('endDate').value;
        const dest = document.getElementById('destinationPlz').value, resDiv = document.getElementById('results');

        resDiv.innerHTML = "Lade Daten...";

        try {
            // Abruf exakt nach Doku-Schema
            const url = `https://corsproxy.io/?${encodeURIComponent(`https://api.kalender.digital/public/event?calendarId=${id}&startDate=${start}&endDate=${end}&includeSubcalendars=1`)}`;
            const resp = await fetch(url, { headers: { 'X-API-KEY': key, 'Accept': 'application/json' } });
            const json = await resp.json();
            const eventsString = JSON.stringify(json).toLowerCase();

            // Google Maps Abfrage
            const service = new google.maps.DistanceMatrixService();
            service.getDistanceMatrix({
                origins: drivers.map(d => d.plz),
                destinations: [dest],
                travelMode: 'DRIVING'
            }, (mResp, status) => {
                let ranking = drivers.map((d, i) => {
                    const namePart = d.name.split(' ')[0].toLowerCase();
                    const isBusy = eventsString.includes(namePart);
                    const dist = mResp.rows[i].elements[0].distance.text;
                    const val = mResp.rows[i].elements[0].distance.value;
                    return { ...d, dist, val, isBusy };
                });

                ranking.sort((a,b) => a.isBusy - b.isBusy || a.val - b.val);
                resDiv.innerHTML = "";
                ranking.forEach(d => {
                    resDiv.innerHTML += `
                        <div class="driver-card ${d.isBusy ? 'is-busy' : 'is-free'}">
                            <div>
                                <strong>${d.name}</strong><br>
                                <small>${d.dist} Entfernung</small><br>
                                ${!d.isBusy ? '<button class="btn-book">Jetzt buchen</button>' : ''}
                            </div>
                            <span class="status-badge ${d.isBusy ? 'busy-badge' : 'free-badge'}">${d.isBusy ? 'BESETZT' : 'FREI'}</span>
                        </div>`;
                });
            });
        } catch(e) { resDiv.innerHTML = "Fehler bei der API-Abfrage."; }
    }
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=YOUR_KEY&libraries=geometry"></script>
</body>
</html>
