<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Springer-Dispo 6.4</title>
    <style>
        :root { --p: #007bff; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        .log-box { background: #000; color: #0f0; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 0.8rem; margin-bottom: 15px; min-height: 80px; }
        .btn-main { width: 100%; padding: 16px; background: var(--p); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="text-align:center; color:var(--p);">Springer-Dispo 6.4</h2>
    
    <div id="statusLog" class="log-box">Status: Test-Modus aktiv</div>

    <label>Ziel-Einrichtung</label>
    <select id="schoolSelect" style="width:100%; padding:10px; margin-bottom:15px;">
        <option value="30655">Albert-Liebmann-Schule (30655)</option>
        <option value="30177">Test-Standort (30177)</option>
    </select>

    <button class="btn-main" onclick="run()">Abfrage mit neuem Proxy starten</button>
    <p style="text-align:center;"><small><a href="#" onclick="setup()">⚙️ Keys verwalten</a></small></p>
</div>

<div id="results" style="max-width: 600px; margin: 20px auto;"></div>

<script>
    const drivers = [
        { name: "Türkel Tuncer", plz: "30161" }, { name: "Von Treskow Albrecht", plz: "30175" },
        { name: "Otto Alexander", plz: "30173" }, { name: "Ferkau Eckart", plz: "30851" },
        { name: "Ohm Lars", plz: "30559" }, { name: "Bachmeier Reinhard", plz: "30659" },
        { name: "Isfahan Mozaffaey Hamid", plz: "30519" }, { name: "Schrader Harald", plz: "30880" },
        { name: "Aschenbach André", plz: "30989" }, { name: "Neubauer Michael", plz: "30853" }
    ];

    function setup() {
        localStorage.setItem('kKey', prompt("X-API-KEY:"));
        localStorage.setItem('gKey', prompt("Google API Key:"));
        location.reload();
    }

    async function run() {
        const kKey = localStorage.getItem('kKey'), gKey = localStorage.getItem('gKey');
        const log = document.getElementById('statusLog');
        if(!kKey) return alert("Key fehlt!");

        log.innerHTML = "📡 Teste Verbindung über AllOrigins...";

        try {
            // Wir nutzen diesmal ein festes Datum für den Test (Jahr-Monat-Tag)
            const targetDate = "2026-04-24";
            const apiUrl = `https://api.kalender.digital/public/event?startDate=${targetDate}&endDate=${targetDate}&timeZone=Europe/Berlin`;
            
            // NEUER PROXY: allorigins umgeht oft Probleme, die corsproxy hat
            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(apiUrl)}`;
            
            const resp = await fetch(proxyUrl, {
                headers: { 'X-API-KEY': kKey.trim() }
            });

            const wrapper = await resp.json();
            // AllOrigins packt die Antwort in ein "contents" Feld
            const data = JSON.parse(wrapper.contents);
            const events = data.events || [];
            
            log.innerHTML = `✅ Erfolg!\nDatum: ${targetDate}\nEvents: ${events.length}`;

            // Distance Matrix & Ranking (wie gehabt)
            const service = new google.maps.DistanceMatrixService();
            service.getDistanceMatrix({
                origins: drivers.map(d => d.plz),
                destinations: [document.getElementById('schoolSelect').value],
                travelMode: 'DRIVING'
            }, (mResp, status) => {
                let ranking = drivers.map((d, i) => {
                    const lastName = d.name.split(' ').pop().toLowerCase();
                    const isBusy = events.some(ev => JSON.stringify(ev).toLowerCase().includes(lastName));
                    const distText = mResp.rows[i].elements[0].distance.text;
                    const distVal = mResp.rows[i].elements[0].distance.value;
                    return { ...d, distT: distText, distV: distVal, isBusy };
                });

                ranking.sort((a,b) => a.isBusy - b.isBusy || a.distV - b.distV);
                const resDiv = document.getElementById('results');
                resDiv.innerHTML = "";
                ranking.forEach(d => {
                    resDiv.innerHTML += `
                        <div style="background:white; padding:10px; margin-top:5px; border-left:5px solid ${d.isBusy ? 'red' : 'green'}; display:flex; justify-content:space-between;">
                            <span>${d.name} (${d.distT})</span>
                            <strong>${d.isBusy ? 'BESETZT' : 'FREI'}</strong>
                        </div>`;
                });
            });

        } catch(e) { log.innerHTML = "❌ Fehler: " + e.message; }
    }

    (function() {
        const key = localStorage.getItem('gKey');
        if(key) {
            const s = document.createElement('script');
            s.src = `https://maps.googleapis.com/maps/api/js?key=${key}`;
            document.head.appendChild(s);
        }
    })();
</script>
</body>
</html>
