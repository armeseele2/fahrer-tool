<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Springer-Dispo 16.0 Business Edition</title>

<style>
:root{
--primary:#2563eb;
--primary-dark:#1d4ed8;
--success:#16a34a;
--danger:#dc2626;
--warning:#f59e0b;
--text:#111827;
--muted:#6b7280;
--line:#e5e7eb;
--card:#ffffff;
--bg:#f3f6fb;
--shadow:0 10px 30px rgba(0,0,0,.08);
--radius:18px;
}

*{
box-sizing:border-box;
}

body{
margin:0;
padding:30px 16px;
font-family:Inter,Segoe UI,Arial,sans-serif;
background:
radial-gradient(circle at top right,#dbeafe 0%,transparent 25%),
radial-gradient(circle at top left,#eff6ff 0%,transparent 20%),
var(--bg);
color:var(--text);
}

.wrapper{
max-width:980px;
margin:auto;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:18px;
gap:12px;
flex-wrap:wrap;
}

.brand{
font-size:1.6rem;
font-weight:800;
letter-spacing:-0.5px;
}

.badge{
padding:8px 14px;
background:#e0ecff;
color:var(--primary);
border-radius:999px;
font-size:.85rem;
font-weight:700;
}

.card{
background:rgba(255,255,255,.92);
backdrop-filter:blur(12px);
border:1px solid rgba(255,255,255,.6);
border-radius:var(--radius);
box-shadow:var(--shadow);
padding:26px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
}

.grid-3{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:14px;
}

label{
display:block;
font-size:.84rem;
font-weight:700;
margin-bottom:7px;
color:var(--muted);
}

input,select{
width:100%;
padding:13px 14px;
border:1px solid var(--line);
border-radius:12px;
font-size:1rem;
outline:none;
transition:.2s;
background:#fff;
}

input:focus,select:focus{
border-color:#93c5fd;
box-shadow:0 0 0 4px rgba(37,99,235,.08);
}

.inline{
display:flex;
align-items:center;
gap:10px;
margin-top:10px;
padding:12px 14px;
border:1px solid var(--line);
border-radius:12px;
background:#fafafa;
}

.inline input{
width:auto;
transform:scale(1.15);
}

.actions{
display:flex;
gap:12px;
margin-top:18px;
flex-wrap:wrap;
}

button{
border:none;
cursor:pointer;
border-radius:12px;
padding:13px 16px;
font-weight:700;
font-size:.96rem;
transition:.2s;
}

.main-btn{
background:linear-gradient(135deg,var(--primary),var(--primary-dark));
color:#fff;
flex:1;
min-width:220px;
box-shadow:0 10px 20px rgba(37,99,235,.22);
}

.main-btn:hover{
transform:translateY(-1px);
}

.setup-btn{
background:#eef2ff;
color:var(--primary);
}

.setup-btn:hover{
background:#dbeafe;
}

.log{
margin-top:18px;
padding:14px;
border-radius:14px;
background:#0f172a;
color:#86efac;
font-family:ui-monospace,monospace;
font-size:.84rem;
min-height:70px;
white-space:pre-wrap;
}

#results{
margin-top:22px;
display:grid;
gap:14px;
}

.driver{
background:#fff;
border-radius:18px;
padding:18px;
box-shadow:var(--shadow);
display:flex;
justify-content:space-between;
gap:14px;
align-items:center;
border:1px solid #eef2f7;
}

.driver-left{
flex:1;
}

.driver-name{
font-size:1.08rem;
font-weight:800;
margin-bottom:6px;
}

.driver-sub{
font-size:.92rem;
color:var(--muted);
margin-bottom:10px;
}

.status{
display:inline-flex;
align-items:center;
gap:8px;
padding:7px 12px;
border-radius:999px;
font-size:.82rem;
font-weight:800;
}

.free{
background:#ecfdf5;
color:var(--success);
}

.busy{
background:#fef2f2;
color:var(--danger);
}

.driver-right{
text-align:right;
min-width:140px;
}

.distance{
font-size:1.2rem;
font-weight:800;
margin-bottom:10px;
}

.book-btn{
background:var(--success);
color:#fff;
width:100%;
}

.book-btn:hover{
filter:brightness(.95);
}

.del-btn{
background:#fff;
color:var(--danger);
border:1px solid #fecaca;
width:100%;
}

.del-btn:hover{
background:#fef2f2;
}

.note{
margin-top:6px;
font-size:.84rem;
color:var(--muted);
}

@media(max-width:760px){

.grid,.grid-3{
grid-template-columns:1fr;
}

.driver{
flex-direction:column;
align-items:flex-start;
}

.driver-right{
text-align:left;
width:100%;
min-width:auto;
}

.book-btn,.del-btn{
width:100%;
}

.actions{
flex-direction:column;
}

.main-btn{
width:100%;
}
}
</style>
</head>

<body>
<div class="wrapper">

<div class="topbar">
<div class="brand">Springer-Dispo</div>
<div class="badge">Version 16.0 Business Edition</div>
</div>

<div class="card">

<div class="grid">
<div>
<label>Einrichtung / Ziel</label>
<select id="schoolSelect" onchange="document.getElementById('destPlz').value=this.value">
<option value="30655">Albert-Liebmann-Schule (30655)</option>
<option value="30165">Lebenshilfe Büttnerstraße (30165)</option>
<option value="30449">Wilhelm-Schade-Schule (30449)</option>
<option value="30853">Pestalozzi-Schule (30853)</option>
<option value="30880">Mecklenheide Forst (30880)</option>
</select>
</div>

<div>
<label>Ziel-PLZ</label>
<input id="destPlz" value="30655">
</div>
</div>

<div class="grid">
<div>
<label>Von Datum</label>
<input type="date" id="dateFrom">
</div>

<div>
<label>Bis Datum</label>
<input type="date" id="dateTo">
</div>
</div>

<div class="inline">
<input type="checkbox" id="wholeDay" checked onchange="toggleTime()">
<label for="wholeDay" style="margin:0;">Ganztägig buchen</label>
</div>

<div class="grid" id="timeBox" style="display:none;margin-top:14px;">
<div>
<label>Startzeit</label>
<input type="time" id="startTime" value="07:00">
</div>

<div>
<label>Endzeit</label>
<input type="time" id="endTime" value="13:00">
</div>
</div>

<div style="margin-top:14px;">
<label>Beschreibung / Tour</label>
<input id="desc" placeholder="z.B. Tour 27 / Hinfahrt">
</div>

<div class="actions">
<button class="main-btn" onclick="run()">Verfügbarkeit & Ranking prüfen</button>
<button class="setup-btn" onclick="setup()">⚙️ Setup</button>
</div>

<div id="log" class="log">Bereit.</div>

</div>

<div id="results"></div>

</div>

<script>
/* ALLE FUNKTIONEN AUS DEINER 15.9 BLEIBEN 1:1 DRIN */
/* HIER EINFACH DEN KOMPLETTEN JAVASCRIPT-TEIL DEINER FUNKTIONIERENDEN 15.9 EINSETZEN */
/* NICHTS ÄNDERN – nur dein bisheriges JS unten einfügen */
</script>

</body>
</html>
