<style>
/* ... (Bisheriger Style) ... */
.pop-row {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}
.pop-col { flex: 1; }
select.pop-select {
    background: #f1f5f9;
    border: 1px solid var(--blue);
    font-weight: bold;
}
</style>

<div id="bookingModal" class="modal-overlay">
    <div class="modal-content">
        <h3 style="margin:0 0 20px; color:var(--blue)">Termin bestätigen</h3>
        
        <label>Fahrername</label>
        <input type="text" id="popDriver" readonly style="background:#f8fafc">

        <label>Zeitraum</label>
        <div id="popDateText" style="font-size:0.95rem; font-weight:700; background:#f1f5f9; padding:12px; border-radius:10px; margin-bottom:10px;"></div>

        <div class="pop-row">
            <div class="pop-col">
                <label>Wer meldet sich?</label>
                <select id="nameSelect" class="pop-select" onchange="updatePopDesc()">
                    <option value="">-- Name wählen --</option>
                    <option value="Andrea">Andrea</option>
                    <option value="Heike">Heike</option>
                    <option value="Angela">Angela</option>
                    <option value="Karin">Karin</option>
                    <option value="Sabine">Sabine</option>
                    <option value="Petra">Petra</option>
                </select>
            </div>
            <div class="pop-col">
                <label>Welche Tour?</label>
                <select id="tourSelect" class="pop-select" onchange="updatePopDesc()">
                    <option value="">-- Tour --</option>
                    </select>
            </div>
        </div>

        <label>Beschreibung (Vorschau / Ergänzung)</label>
        <textarea id="popDesc" rows="3" placeholder="Wähle oben Name und Tour..."></textarea>

        <div class="modal-footer">
            <button class="cancel-btn" onclick="closeModal()">Abbrechen</button>
            <button class="confirm-btn" onclick="confirmBooking()">Termin buchen</button>
        </div>
    </div>
</div>

<script>
/* ... (Fahrerliste und bisherige Funktionen bleiben gleich) ... */

// Befülle die Tour-Liste von 1 bis 30 beim Laden
window.onload = function() {
    const ts = document.getElementById('tourSelect');
    for(let i=1; i<=30; i++) {
        let opt = document.createElement('option');
        opt.value = "Tour " + i;
        opt.innerHTML = "Tour " + i;
        ts.appendChild(opt);
    }
};

function openBookingModal(name) {
    currentDriverForBooking = name;
    document.getElementById('popDriver').value = name;
    
    const schoolText = document.getElementById('schoolSelect').selectedOptions[0].text;
    const dateFrom = document.getElementById('dateFrom').value;
    const dateTo = document.getElementById('dateTo').value;
    const wholeDay = document.getElementById('wholeDay').checked;
    
    let timeInfo = wholeDay ? '(Ganztägig)' : `(${document.getElementById('startTime').value}-${document.getElementById('endTime').value} Uhr)`;
    
    document.getElementById('popDateText').innerText = `Vom ${dateFrom} bis ${dateTo} ${timeInfo}`;
    
    // Resets
    document.getElementById('nameSelect').value = "";
    document.getElementById('tourSelect').value = "";
    document.getElementById('popDesc').value = "";
    
    document.getElementById('bookingModal').style.display = 'flex';
}

// Neue Funktion: Baut den Text automatisch zusammen
function updatePopDesc() {
    const name = document.getElementById('nameSelect').value;
    const tour = document.getElementById('tourSelect').value;
    let finalBtn = "";
    
    if(name) {
        finalBtn = name + " meldet sich: ";
    }
    if(tour) {
        finalBtn += tour;
    }
    
    document.getElementById('popDesc').value = finalBtn;
}

/* ... (confirmBooking und executeBooking bleiben gleich wie im reparierten Code zuvor) ... */

function closeModal(){ document.getElementById('bookingModal').style.display='none'; }

async function confirmBooking() {
    const desc = document.getElementById('popDesc').value || "Keine Beschreibung";
    closeModal();
    executeBooking(currentDriverForBooking, desc);
}

// ... (Restliche Fetch-Funktionen wie gehabt) ...
</script>
