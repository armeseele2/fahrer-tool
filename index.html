<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Springer-Dispo 15.9 - Komplette Fahrerliste</title>

<style>
:root{
--blue:#007bff;
--green:#28a745;
--red:#dc3545;
--bg:#f4f7f6;
}

body{
margin:0;
padding:20px;
background:var(--bg);
font-family:Segoe UI,sans-serif;
color:#333;
}

.card{
max-width:820px;
margin:auto;
background:#fff;
padding:24px;
border-radius:14px;
box-shadow:0 4px 18px rgba(0,0,0,.08);
}

h2{
margin-top:0;
text-align:center;
color:var(--blue);
}

label{
display:block;
margin:12px 0 6px;
font-weight:700;
font-size:.92rem;
}

input,select{
width:100%;
padding:11px;
border:1px solid #ddd;
border-radius:8px;
box-sizing:border-box;
font-size:1rem;
}

.row{
display:flex;
gap:10px;
}

.row>div{
flex:1;
}

button{
border:none;
border-radius:8px;
cursor:pointer;
font-weight:700;
}

.main-btn{
width:100%;
padding:14px;
margin-top:14px;
background:var(--blue);
color:#fff;
font-size:1rem;
}

.setup-btn{
margin-top:10px;
padding:10px 14px;
background:#eee;
}

.book-btn{
margin-top:8px;
padding:8px 12px;
background:var(--green);
color:#fff;
}

.del-btn{
margin-top:8px;
padding:6px 10px;
background:#fff;
color:var(--red);
border:1px solid var(--red);
font-size: 0.8rem;
}

.del-btn:hover{
background:var(--red);
color:#fff;
}

.log{
margin-top:14px;
background:#111;
color:#0f0;
padding:12px;
border-radius:8px;
font-family:monospace;
font-size:.82rem;
white-space:pre-wrap;
min-height:72px;
}

#results{
max-width:820px;
margin:18px auto;
}

.driver{
background:#fff;
padding:14px;
border-radius:10px;
margin-bottom:10px;
display:flex;
justify-content:space-between;
align-items:center;
border-left:7px solid #ccc;
box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.free{
border-left-color:var(--green);
background:#fafffa;
}

.busy{
border-left-color:var(--red);
background:#fff5f5;
}

.state{
display:inline-block;
padding:5px 10px;
border-radius:6px;
font-size:.82rem;
font-weight:700;
color:#fff;
margin-top:6px;
}

.state.free{background:var(--green);}
.state.busy{background:var(--red);}

.inline{
display:flex;
align-items:center;
gap:8px;
margin-top:10px;
}

.inline input[type=checkbox]{
width:auto;
transform:scale(1.2);
}

small{color:#666;}
</style>
</head>

<body>

<div class="card">

<h2>Springer-Dispo 15.9</h2>

<label>Einrichtung / Ziel</label>
<select id="schoolSelect" onchange="document.getElementById('destPlz').value=this.value">
<option value="30655">Albert-Liebmann-Schule (30655)</option>
        <option value="30165">Lebenshilfe Büttnerstraße (30165)</option>
        <option value="30900">Kindergarten Domino (30900)</option>
        <option value="30419">Kindergarten - Forst Mecklenheide (30419)</option>
        <option value="30880">Freie Martinschule (30880)</option>
        <option value="30851">Kindergarten Langenhagen (30851)</option>
        <option value="30629">Kindergarten Misburg (30629)</option>
        <option value="31535">Michael-Ende-Schule (31535)</option>
        <option value="31515">Paul-Moor-Schule (31515)</option>
        <option value="30938">Pestalozzi-Schule (30938)</option>
        <option value="31303">Grundschule Otze (31303)</option>
        <option value="31303">Schule am Wasserwerk (31303)</option>
        <option value="31319">Schule im Großen Freien (31319)</option>
        <option value="30900">Unter den Eichen/BOS (30900)</option>
        <option value="30179">Stötzner-Schule (30179)</option>
        <option value="30449">Wilhelm-Schade-Schule (30449)</option>
        <option value="30559">Bildungszentrum f. Taubblinde (30559)</option>
        <option value="30900">GS Bissendorf/ Brelingen (30900)</option>
        <option value="30855">Adolf-Reichwein-Schule (30855)</option>
        <option value="30982">Calenberger Schule (30982)</option>
        <option value="30938">Kindergarten Craney (30938)</option>
        <option value="30890">Bert-Brecht-Schule (30890)</option>
        <option value="30853">Gutzmann Schule (30853)</option>
        <option value="30926">Anne Frank Schule (30926)</option>

    </select>

   
<label>Ziel-PLZ</label>
<input id="destPlz" value="30655">

<div class="row">
<div>
<label>Von Datum</label>
<input type="date" id="dateFrom" value="2026-04-24">
</div>
<div>
<label>Bis Datum</label>
<input type="date" id="dateTo" value="2026-04-24">
</div>
</div>

<div class="inline">
<input type="checkbox" id="wholeDay" checked onchange="toggleTime()">
<label for="wholeDay" style="margin:0;">Ganztägig buchen</label>
</div>

<div class="row" id="timeBox" style="display:none;">
<div>
<label>Startzeit</label>
<input type="time" id="startTime" value="07:00">
</div>
<div>
<label>Endzeit</label>
<input type="time" id="endTime" value="13:00">
</div>
</div>

<label>Beschreibung / Tour</label>
<input id="desc" placeholder="z.B. Tour 27 / Hinfahrt">

<button class="main-btn" onclick="run()">Verfügbarkeit & Ranking prüfen</button>
<button class="setup-btn" onclick="setup()">⚙️ Setup (Keys / IDs)</button>

<div id="log" class="log">Bereit.</div>

</div>

<div id="results"></div>

<script>
// Die NEUE vollständige Liste aller 18 Fahrer
const drivers = [
    {name:"Aschenbach André", plz:"30989"},
    {name:"Ohm Lars", plz:"30559"},
    {name:"Bachmeier Reinhard", plz:"30659"},
    {name:"Isfahan Mozaffaey Hamid", plz:"30519"},
    {name:"Otto Alexander", plz:"30173"},
    {name:"Türkel Tuncer", plz:"30161"},
    {name:"Schrader Harald", plz:"30880"},
    {name:"Neubauer Michael", plz:"30853"},
    {name:"Ferkau Eckart", plz:"30851"},
    {name:"Bethmann Ekkehard", plz:"31535"},
    {name:"Hauer Frank", plz:"30900"},
    {name:"Kruse Jens Roland", plz:"31275"},
    {name:"Grimpe Dirk", plz:"30827"},
    {name:"Häge Klaus Dieter", plz:"30519"},
    {name:"Von Treskow Albrecht", plz:"30659"},
    {name:"Caruso Guiseppe", plz:"30880"},
    {name:"Popescu Viorel", plz:"30827"},
    {name:"Beka Jonel", plz:"31275"}
];

let loadedEvents=[];

function setup(){
    localStorage.setItem("kKey",prompt("Kalender.digital API-Key:",localStorage.getItem("kKey")||""));
    localStorage.setItem("kIds",prompt("Kalender-ID(s), komma getrennt:",localStorage.getItem("kIds")||""));
    localStorage.setItem("gKey",prompt("Google API Key:",localStorage.getItem("gKey")||""));
    location.reload();
}

function log(t){
    document.getElementById("log").textContent=t;
}

function toggleTime(){
    document.getElementById("timeBox").style.display =
    document.getElementById("wholeDay").checked ? "none":"flex";
}

async function run(){
    try{
        const kKey=localStorage.getItem("kKey");
        const kIds=localStorage.getItem("kIds");
        const gKey=localStorage.getItem("gKey");

        if(!kKey||!kIds||!gKey){
            alert("Bitte Setup ausfüllen.");
            return;
        }

        const from=document.getElementById("dateFrom").value;
        const to=document.getElementById("dateTo").value;
        const dest=document.getElementById("destPlz").value;

        log("📅 Lade aktuelle Kalenderdaten...");
        loadedEvents=await loadEvents(from,to,kIds,kKey);

        log("🗺️ Lade Maps...");
        await loadGoogle(gKey);

        log("📏 Berechne Distanz...");
        const matrix=await getDistances(dest);

        let ranking=drivers.map((d,i)=>{
            const hit=isBusy(d.name,loadedEvents);
            return{
                ...d,
                busy:hit.busy,
                reason:hit.reason,
                eventId:hit.eventId,
                distText:matrix.rows[i].elements[0].distance.text,
                distVal:matrix.rows[i].elements[0].distance.value
            };
        });

        ranking.sort((a,b)=>(a.busy-b.busy)||(a.distVal-b.distVal));
        render(ranking);
        log("✅ Analyse fertig.");

    }catch(e){
        console.error(e);
        log("❌ "+e.message);
    }
}

async function loadEvents(from,to,kIds,kKey){
    let all=[];
    for(const raw of kIds.split(",")){
        const id=raw.trim();
        const salt = Math.floor(Math.random() * 999999);
        const url=`https://api.kalender.digital/public/event?calendarId=${encodeURIComponent(id)}&startDate=${from}&endDate=${to}T23:59:59&timeZone=Europe/Berlin&v=${Date.now()}&s=${salt}`;
        const proxy="https://corsproxy.io/?"+encodeURIComponent(url);
        const r=await fetch(proxy,{headers:{"X-API-KEY":kKey}});
        if(!r.ok) continue;
        const data=await r.json();
        if(Array.isArray(data)) all.push(...data);
        else if(Array.isArray(data.events)) all.push(...data.events);
    }
    return all;
}

function isBusy(name,events){
    if (!events || events.length === 0) return { busy: false, reason: "", eventId: null };
    const searchName = name.toLowerCase().trim();
    const lastName = searchName.split(" ").pop();

    for(const ev of events){
        let txt="";
        if(ev.title) txt+=" "+ev.title.toLowerCase();
        if(ev.description) txt+=" "+ev.description.toLowerCase();
        if(ev.who) txt+=" "+ev.who.toLowerCase();
        if(Array.isArray(ev.subCalendars)) txt+=" "+ev.subCalendars.join(" ").toLowerCase();

        if(txt.includes(searchName) || (lastName && txt.includes(lastName))){
            return{ busy:true, reason:ev.title||"Belegt", eventId:ev.id };
        }
    }
    return{ busy:false, reason:"", eventId: null };
}

function loadGoogle(key){
    return new Promise(resolve=>{
        if(typeof google!=="undefined") return resolve();
        const s=document.createElement("script");
        s.src=`https://maps.googleapis.com/maps/api/js?key=${key}`;
        s.onload=resolve;
        document.head.appendChild(s);
    });
}

function getDistances(dest){
    return new Promise((resolve,reject)=>{
        new google.maps.DistanceMatrixService().getDistanceMatrix({
            origins:drivers.map(d=>d.plz),
            destinations:[dest],
            travelMode:"DRIVING"
        },(res,status)=>{
            if(status!=="OK") return reject(new Error("Google Fehler"));
            resolve(res);
        });
    });
}

function render(list){
    document.getElementById("results").innerHTML=list.map(d=>`
        <div class="driver ${d.busy?'busy':'free'}">
            <div>
                <strong>${d.name}</strong><br>
                <small>${d.distText} entfernt</small><br>
                ${d.busy
                    ? `<span class="state busy">BESETZT</span><br><small>${d.reason}</small><br>
                       <button class="del-btn" onclick="deleteEvent('${d.eventId}', '${safe(d.name)}')">🗑️ Termin löschen</button>`
                    : `<span class="state free">FREI</span><br>
                       <button class="book-btn" onclick="book('${safe(d.name)}')">BUCHEN</button>`
                }
            </div>
            <div style="font-size:1.1rem;font-weight:bold;">
                ${d.distText}
            </div>
        </div>
    `).join("");
}

function safe(t){ return t.replace(/'/g,"\\'"); }

async function book(driver){
    try{
        const kKey=localStorage.getItem("kKey");
        const from=document.getElementById("dateFrom").value;
        const to=document.getElementById("dateTo").value;
        const whole=document.getElementById("wholeDay").checked;
        const start=document.getElementById("startTime").value;
        const end=document.getElementById("endTime").value;
        const title=document.getElementById("schoolSelect").selectedOptions[0].text;
        const desc=document.getElementById("desc").value || "Automatisch gebucht";

        let payload={
            startDate: whole ? `${from} 00:00:00` : `${from} ${start}:00`,
            endDate: whole ? `${to} 23:59:59` : `${to} ${end}:00`,
            timeZone:"Europe/Berlin",
            title:title,
            description:desc,
            wholeDay:whole,
            subCalendars:[driver],
            links:[]
        };

        log("📝 Buche...");
        const url="https://api.kalender.digital/public/event";
        const proxy="https://corsproxy.io/?"+encodeURIComponent(url);
        const r=await fetch(proxy,{
            method:"POST",
            headers:{"Content-Type":"application/json","X-API-KEY":kKey},
            body:JSON.stringify(payload)
        });
        if(!r.ok) throw new Error("Buchung fehlgeschlagen");
        alert("✅ Gebucht: "+driver);
        run();
    }catch(e){ console.error(e); alert("❌ "+e.message); }
}

async function deleteEvent(eventId, driverName) {
    if(!eventId || eventId === "null") { alert("Fehler: Termin-ID nicht gefunden."); return; }
    if(!confirm(`Soll der Termin für ${driverName} wirklich gelöscht werden?`)) return;
    try {
        const kKey = localStorage.getItem("kKey");
        log("🗑️ Lösche Termin...");
        const url = `https://api.kalender.digital/public/event/${eventId}`;
        const proxy = "https://corsproxy.io/?" + encodeURIComponent(url);
        const r = await fetch(proxy, {
            method: "DELETE",
            headers: { "X-API-KEY": kKey }
        });
        if (!r.ok) throw new Error("Löschen fehlgeschlagen");
        alert("✅ Termin für " + driverName + " gelöscht.");
        run();
    } catch (e) { alert("❌ Fehler: " + e.message); }
}
</script>
</body>
</html>
