<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Springer-Dispo Pro v43.1 FINAL</title>

<style>
:root{
--blue:#2563eb;
--green:#16a34a;
--red:#dc2626;
--bg:#eef2f7;
}

body{
font-family:Segoe UI,sans-serif;
background:linear-gradient(135deg,#eef2f7,#dbeafe);
padding:20px;
margin:0;
}

.card{
max-width:850px;
margin:auto;
background:#fff;
padding:25px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

h2{text-align:center;color:var(--blue);}

label{display:block;margin:10px 0 5px;font-weight:600;}

input,select,textarea{
width:100%;
padding:10px;
border:1px solid #ddd;
border-radius:10px;
}

.row{
display:flex;
gap:10px;
}

button{
border:none;
border-radius:10px;
cursor:pointer;
font-weight:600;
}

.main-btn{
width:100%;
padding:14px;
background:var(--blue);
color:#fff;
margin-top:15px;
}

.setup-btn{
width:100%;
padding:10px;
margin-top:10px;
background:#eee;
}

.book-btn{background:var(--green);color:#fff;padding:8px 14px;margin-top:8px;}
.del-btn{background:#fff;color:var(--red);border:1px solid var(--red);padding:6px 10px;margin-top:8px;}

.log{
margin-top:10px;
background:#111;
color:#0f0;
padding:10px;
border-radius:10px;
font-family:monospace;
font-size:0.8rem;
}

#results{
max-width:850px;
margin:20px auto;
}

.driver{
background:#fff;
padding:15px;
border-radius:12px;
margin-bottom:10px;
display:flex;
justify-content:space-between;
border-left:10px solid #ccc;
}

.free{border-left-color:var(--green);}
.busy{border-left-color:var(--red);background:#fff1f2;}

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.5);
justify-content:center;
align-items:center;
}

.modal-box{
background:#fff;
padding:20px;
border-radius:20px;
width:400px;
}

.inline{
display:flex;
align-items:center;
gap:8px;
margin-top:10px;
}

#timeBox{display:none;gap:10px;}
</style>
</head>

<body>

<div class="card">

<h2>Springer-Dispo Pro v43.1</h2>

<label>Einrichtung</label>
<select id="schoolSelect">
<option value="30655">Albert-Liebmann-Schule</option>
<option value="30165">Lebenshilfe Büttnerstraße</option>
<option value="30449">Wilhelm-Schade-Schule</option>
<option value="30853">Pestalozzi-Schule</option>
<option value="30880">Mecklenheide Forst</option>
</select>

<label>Start-PLZ</label>
<input id="startPlz" value="30159">

<div class="row">
<div>
<label>Von</label>
<input type="date" id="dateFrom" value="2026-12-01">
</div>
<div>
<label>Bis</label>
<input type="date" id="dateTo" value="2026-12-01">
</div>
</div>

<div class="inline">
<input type="checkbox" id="wholeDay" checked onchange="toggleTime()">
<label>Ganztägig</label>
</div>

<div id="timeBox" class="row">
<input type="time" id="startTime" value="07:00">
<input type="time" id="endTime" value="13:00">
</div>

<button class="main-btn" onclick="run()">Verfügbarkeit prüfen</button>
<button class="setup-btn" onclick="setup()">API Setup</button>

<div class="log" id="log">Bereit.</div>

</div>

<div id="results"></div>

<div class="modal" id="modal">
<div class="modal-box">
<h3>Buchen</h3>

<label>Fahrer</label>
<input id="modalDriver" readonly>

<label>Beschreibung</label>
<textarea id="modalDesc">Tour</textarea>

<div class="row">
<button onclick="closeModal()">Abbruch</button>
<button onclick="confirmBooking()">Buchen</button>
</div>

</div>
</div>

<script>
const drivers=[
{name:"Aschenbach André",plz:"30989"},
{name:"Ohm Lars",plz:"30559"},
{name:"Bachmeier Reinhard",plz:"30659"},
{name:"Otto Alexander",plz:"30173"},
{name:"Türkel Tuncer",plz:"30161"}
];

let loadedEvents=[];
let currentDriver="";

function toggleTime(){
timeBox.style.display = wholeDay.checked ? "none" : "flex";
}

function setup(){
localStorage.setItem("kKey",prompt("API Key:",localStorage.getItem("kKey")||""));
localStorage.setItem("kIds",prompt("Kalender IDs:",localStorage.getItem("kIds")||""));
localStorage.setItem("gKey",prompt("Google Key:",localStorage.getItem("gKey")||""));
location.reload();
}

function log(t){logBox.textContent=t;}
const logBox=document.getElementById("log");

async function run(){
const kKey=localStorage.getItem("kKey");
const kIds=localStorage.getItem("kIds");
const gKey=localStorage.getItem("gKey");

if(!kKey||!kIds||!gKey)return alert("Setup fehlt");

const from=dateFrom.value;
const to=dateTo.value;

log("Lade Kalender...");
loadedEvents=await loadEvents(from,to,kIds,kKey);

await loadGoogle(gKey);
const matrix=await getDistances(startPlz.value);

let ranking=drivers.map((d,i)=>{
const hit=isBusy(d.name,loadedEvents);
return{
...d,
busy:hit.busy,
reason:hit.reason,
eventId:hit.eventId,
distText:matrix.rows[i].elements[0].distance.text,
distVal:matrix.rows[i].elements[0].distance.value
};
});

ranking.sort((a,b)=>(a.busy-b.busy)||(a.distVal-b.distVal));

render(ranking);
log("Fertig");
}

async function loadEvents(from,to,kIds,kKey){
let all=[];
for(const id of kIds.split(",")){
const url=`https://api.kalender.digital/public/event?calendarId=${id.trim()}&startDate=${from}&endDate=${to}T23:59:59`;
const r=await fetch("https://corsproxy.io/?"+encodeURIComponent(url),{headers:{"X-API-KEY":kKey}});
if(r.ok){
const d=await r.json();
all.push(...(d.events||d));
}
}
return all;
}

function isBusy(name,events){
const search=name.toLowerCase();
for(const ev of events){
let txt=(ev.subCalendars||[]).join(" ").toLowerCase();
if(txt.includes(search)){
return{busy:true,reason:ev.title,eventId:ev.id};
}
}
return{busy:false};
}

function render(list){
results.innerHTML=list.map(d=>`
<div class="driver ${d.busy?'busy':'free'}">
<div>
<strong>${d.name}</strong><br>
${d.busy
?`❌ ${d.reason}<br><button class="del-btn" onclick="deleteEvent('${d.eventId}')">Löschen</button>`
:`✅ Frei<br><button class="book-btn" onclick="openModal('${d.name}')">Buchen</button>`}
</div>
<div>${d.distText}</div>
</div>
`).join("");
}

function openModal(name){
currentDriver=name;
modalDriver.value=name;
modal.style.display="flex";
}

function closeModal(){
modal.style.display="none";
}

async function confirmBooking(){
const kKey=localStorage.getItem("kKey");

const from=dateFrom.value;
const to=dateTo.value;

const whole=wholeDay.checked;
const start=startTime.value;
const end=endTime.value;

const payload={
startDate: whole?`${from} 00:00:00`:`${from} ${start}:00`,
endDate: whole?`${to} 23:59:59`:`${to} ${end}:00`,
timeZone:"Europe/Berlin",
title:schoolSelect.selectedOptions[0].text,
description:modalDesc.value,
wholeDay:whole,
subCalendars:[currentDriver]
};

await fetch("https://corsproxy.io/?"+encodeURIComponent("https://api.kalender.digital/public/event"),{
method:"POST",
headers:{"Content-Type":"application/json","X-API-KEY":kKey},
body:JSON.stringify(payload)
});

closeModal();
run();
}

async function deleteEvent(id){
const kKey=localStorage.getItem("kKey");

await fetch("https://corsproxy.io/?"+encodeURIComponent(`https://api.kalender.digital/public/event/${id}`),{
method:"DELETE",
headers:{"X-API-KEY":kKey}
});

run();
}

function loadGoogle(key){
return new Promise(resolve=>{
if(typeof google!=="undefined")return resolve();
const s=document.createElement("script");
s.src=`https://maps.googleapis.com/maps/api/js?key=${key}`;
s.onload=resolve;
document.head.appendChild(s);
});
}

function getDistances(start){
return new Promise((resolve)=>{
new google.maps.DistanceMatrixService().getDistanceMatrix({
origins:drivers.map(d=>d.plz),
destinations:[start],
travelMode:"DRIVING"
},(res)=>resolve(res));
});
}
</script>

</body>
</html>
