<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Springer-Dispo Pro v2</title>
    <style>
        :root {
            --primary: #2563eb;
            --success: #22c55e;
            --danger: #ef4444;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
        }

        body {
            margin: 0;
            padding: 15px;
            background-color: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-main);
        }

        .container { max-width: 600px; margin: 0 auto; }

        .header-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        h2 { margin: 0 0 20px 0; font-size: 22px; text-align: center; color: var(--primary); font-weight: 800; }

        .input-group { margin-bottom: 12px; }

        label { display: block; margin-bottom: 4px; font-weight: 600; font-size: 13px; color: var(--text-sub); }

        input, select {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            background: #fff;
            box-sizing: border-box;
        }

        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        .checkbox-container {
            display: flex;
            align-items: center;
            background: #f1f5f9;
            padding: 10px;
            border-radius: 10px;
            margin: 10px 0;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .checkbox-container input { width: auto; margin-right: 10px; transform: scale(1.2); }

        .main-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
        }

        .setup-btn {
            background: none; border: none; color: var(--text-sub);
            width: 100%; margin-top: 8px; font-size: 12px; text-decoration: underline; cursor: pointer;
        }

        .log {
            margin-top: 12px; background: #1e293b; color: #38bdf8;
            padding: 8px; border-radius: 8px; font-family: monospace; font-size: 11px;
        }

        .driver-card {
            background: var(--card-bg);
            margin-bottom: 10px;
            padding: 14px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border-left: 6px solid #cbd5e1;
        }

        .driver-card.free { border-left-color: var(--success); }
        .driver-card.busy { border-left-color: var(--danger); }

        .driver-info h3 { margin: 0; font-size: 16px; }
        .driver-info p { margin: 2px 0; font-size: 12px; color: var(--text-sub); }

        .status-badge {
            font-size: 10px; font-weight: 800; padding: 3px 7px;
            border-radius: 5px; text-transform: uppercase; display: inline-block; margin: 5px 0;
        }

        .status-badge.free { background: #dcfce7; color: #166534; }
        .status-badge.busy { background: #fee2e2; color: #991b1b; }

        .action-btn {
            padding: 8px 14px; border-radius: 8px; font-weight: 700; border: none; cursor: pointer; font-size: 13px;
        }

        .book-btn { background: var(--success); color: white; }
        .del-btn { background: white; color: var(--danger); border: 1.5px solid var(--danger); }

        .dist-tag { text-align: right; font-weight: 800; color: var(--primary); font-size: 16px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-card">
        <h2>Springer-Dispo 15.9</h2>

        <div class="input-group">
            <label>Zielort</label>
            <select id="schoolSelect" onchange="document.getElementById('destPlz').value=this.value">
                <option value="30655">Albert-Liebmann-Schule (30655)</option>
                <option value="30165">Lebenshilfe Büttnerstraße (30165)</option>
                <option value="30900">Kindergarten Domino (30900)</option>
                <option value="30419">Kindergarten - Forst Mecklenheide (30419)</option>
                <option value="30880">Freie Martinschule (30880)</option>
                <option value="30851">Kindergarten Langenhagen (30851)</option>
                <option value="30629">Kindergarten Misburg (30629)</option>
                <option value="31535">Michael-Ende-Schule (31535)</option>
                <option value="31515">Paul-Moor-Schule (31515)</option>
                <option value="30938">Pestalozzi-Schule (30938)</option>
                <option value="31303">Grundschule Otze (31303)</option>
                <option value="31303">Schule am Wasserwerk (31303)</option>
                <option value="31319">Schule im Großen Freien (31319)</option>
                <option value="30900">Unter den Eichen/BOS (30900)</option>
                <option value="30179">Stötzner-Schule (30179)</option>
                <option value="30449">Wilhelm-Schade-Schule (30449)</option>
                <option value="30559">Bildungszentrum f. Taubblinde (30559)</option>
                <option value="30900">GS Bissendorf/ Brelingen (30900)</option>
                <option value="30855">Adolf-Reichwein-Schule (30855)</option>
                <option value="30982">Calenberger Schule (30982)</option>
                <option value="30938">Kindergarten Craney (30938)</option>
                <option value="30890">Bert-Brecht-Schule (30890)</option>
                <option value="30853">Gutzmann Schule (30853)</option>
                <option value="30926">Anne Frank Schule (30926)</option>
            </select>
        </div>

        <div class="input-group">
            <label>Ziel-PLZ</label>
            <input id="destPlz" value="30655">
        </div>

        <div class="row">
            <div class="input-group">
                <label>Von</label>
                <input type="date" id="dateFrom" value="2026-04-24">
            </div>
            <div class="input-group">
                <label>Bis</label>
                <input type="date" id="dateTo" value="2026-04-24">
            </div>
        </div>

        <label class="checkbox-container">
            <input type="checkbox" id="wholeDay" checked onchange="toggleTime()">
            <span>Ganztägig buchen</span>
        </label>

        <div class="row" id="timeBox" style="display:none;">
            <div class="input-group">
                <label>Start</label>
                <input type="time" id="startTime" value="07:00">
            </div>
            <div class="input-group">
                <label>Ende</label>
                <input type="time" id="endTime" value="13:00">
            </div>
        </div>

        <div class="input-group">
            <label>Info / Tour</label>
            <input id="desc" placeholder="z.B. Tour 27">
        </div>

        <button class="main-btn" onclick="run()">VERFÜGBARKEIT PRÜFEN</button>
        <button class="setup-btn" onclick="setup()">⚙️ Einstellungen</button>

        <div id="log" class="log">Bereit.</div>
    </div>

    <div id="results"></div>
</div>

<script>
const drivers = [
    {name:"Aschenbach André", plz:"30989"},
    {name:"Ohm Lars", plz:"30559"},
    {name:"Bachmeier Reinhard", plz:"30659"},
    {name:"Isfahan Mozaffaey Hamid", plz:"30519"},
    {name:"Otto Alexander", plz:"30173"},
    {name:"Türkel Tuncer", plz:"30161"},
    {name:"Schrader Harald", plz:"30880"},
    {name:"Neubauer Michael", plz:"30853"},
    {name:"Ferkau Eckart", plz:"30851"},
    {name:"Bethmann Ekkehard", plz:"31535"},
    {name:"Hauer Frank", plz:"30900"},
    {name:"Kruse Jens Roland", plz:"31275"},
    {name:"Grimpe Dirk", plz:"30827"},
    {name:"Häge Klaus Dieter", plz:"30519"},
    {name:"Von Treskow Albrecht", plz:"30659"},
    {name:"Caruso Guiseppe", plz:"30880"},
    {name:"Popescu Viorel", plz:"30827"},
    {name:"Beka Jonel", plz:"31275"}
];

let loadedEvents=[];

function setup(){
    localStorage.setItem("kKey",prompt("API-Key:",localStorage.getItem("kKey")||""));
    localStorage.setItem("kIds",prompt("Kalender-IDs:",localStorage.getItem("kIds")||""));
    localStorage.setItem("gKey",prompt("Google Key:",localStorage.getItem("gKey")||""));
    location.reload();
}

function log(t){ document.getElementById("log").textContent=t; }

function toggleTime(){
    document.getElementById("timeBox").style.display = document.getElementById("wholeDay").checked ? "none":"grid";
}

async function run(){
    try{
        const kKey=localStorage.getItem("kKey"), kIds=localStorage.getItem("kIds"), gKey=localStorage.getItem("gKey");
        if(!kKey||!kIds||!gKey) return alert("Setup fehlt");
        
        const from=document.getElementById("dateFrom").value, to=document.getElementById("dateTo").value, dest=document.getElementById("destPlz").value;
        log("📅 Lade Daten...");
        loadedEvents=await loadEvents(from,to,kIds,kKey);
        log("🗺️ Google Maps...");
        await loadGoogle(gKey);
        log("📏 Distanzen...");
        const matrix=await getDistances(dest);

        let ranking=drivers.map((d,i)=>{
            const hit=isBusy(d.name,loadedEvents);
            return{
                ...d, busy:hit.busy, reason:hit.reason, eventId:hit.eventId,
                distText:matrix.rows[i].elements[0].distance.text,
                distVal:matrix.rows[i].elements[0].distance.value
            };
        });
        ranking.sort((a,b)=>(a.busy-b.busy)||(a.distVal-b.distVal));
        render(ranking);
        log("✅ Analyse fertig.");
    }catch(e){ log("❌ Fehler: "+e.message); }
}

async function loadEvents(from,to,kIds,kKey){
    let all=[];
    for(const raw of kIds.split(",")){
        const id=raw.trim();
        const url=`https://api.kalender.digital/public/event?calendarId=${encodeURIComponent(id)}&startDate=${from}&endDate=${to}T23:59:59`;
        const proxy="https://corsproxy.io/?"+encodeURIComponent(url);
        const r=await fetch(proxy,{headers:{"X-API-KEY":kKey}});
        const data=await r.json();
        if(Array.isArray(data)) all.push(...data); else if(data.events) all.push(...data.events);
    }
    return all;
}

function isBusy(name,events){
    if (!events) return { busy: false, reason: "", eventId: null };
    const searchName = name.toLowerCase().trim();
    const lastName = searchName.split(" ").pop();
    for(const ev of events){
        let txt = (ev.title + " " + (ev.description||"")).toLowerCase();
        if(txt.includes(searchName) || (lastName && txt.includes(lastName))) {
            return { busy:true, reason:ev.title||"Belegt", eventId:ev.id };
        }
    }
    return { busy:false, reason:"", eventId: null };
}

function loadGoogle(key){
    return new Promise(resolve=>{
        if(typeof google!=="undefined") return resolve();
        const s=document.createElement("script");
        s.src=`https://maps.googleapis.com/maps/api/js?key=${key}`;
        s.onload=resolve;
        document.head.appendChild(s);
    });
}

function getDistances(dest){
    return new Promise((resolve,reject)=>{
        new google.maps.DistanceMatrixService().getDistanceMatrix({
            origins:drivers.map(d=>d.plz), destinations:[dest], travelMode:"DRIVING"
        },(res,status)=>{ if(status!=="OK") reject(new Error("Google Fehler")); else resolve(res); });
    });
}

function render(list){
    document.getElementById("results").innerHTML=list.map(d=>`
        <div class="driver-card ${d.busy?'busy':'free'}">
            <div class="driver-info">
                <h3>${d.name}</h3>
                <p>${d.distText} • ${d.plz}</p>
                <span class="status-badge ${d.busy?'busy':'free'}">${d.busy?'Besetzt':'Verfügbar'}</span>
                ${d.busy ? `<br><small style="color:var(--danger)">${d.reason}</small><br><button class="action-btn del-btn" onclick="deleteEvent('${d.eventId}', '${d.name}')">🗑️ Löschen</button>` 
                         : `<br><button class="action-btn book-btn" onclick="book('${d.name}')">BUCHEN</button>`}
            </div>
            <div class="dist-tag">${d.distText}</div>
        </div>
    `).join("");
}

async function book(driver){
    try {
        const kKey=localStorage.getItem("kKey");
        const from=document.getElementById("dateFrom").value, to=document.getElementById("dateTo").value, whole=document.getElementById("wholeDay").checked;
        const start=document.getElementById("startTime").value, end=document.getElementById("endTime").value;
        const title=document.getElementById("schoolSelect").selectedOptions[0].text;
        const desc=document.getElementById("desc").value || "Automatisch gebucht";

        let payload={
            startDate: whole ? `${from} 00:00:00` : `${from} ${start}:00`,
            endDate: whole ? `${to} 23:59:59` : `${to} ${end}:00`,
            timeZone:"Europe/Berlin", title:title, description:desc,
            wholeDay:whole, subCalendars:[driver]
        };

        const proxy="https://corsproxy.io/?https%3A%2F%2Fapi.kalender.digital%2Fpublic%2Fevent";
        const r=await fetch(proxy,{
            method:"POST", headers:{"Content-Type":"application/json","X-API-KEY":kKey},
            body:JSON.stringify(payload)
        });
        if(r.ok) { alert("Erfolgreich gebucht!"); run(); } else { alert("Fehler bei Buchung"); }
    } catch(e) { alert("Fehler: "+e.message); }
}

async function deleteEvent(eventId, name) {
    if(!eventId || eventId === "null") return alert("ID fehlt");
    if(!confirm(name+" wirklich löschen?")) return;
    try {
        const kKey=localStorage.getItem("kKey");
        const proxy="https://corsproxy.io/?https%3A%2F%2Fapi.kalender.digital%2Fpublic%2Fevent%2F"+eventId;
        const r=await fetch(proxy,{ method:"DELETE", headers:{"X-API-KEY":kKey} });
        if(r.ok) { alert("Gelöscht!"); run(); }
    } catch(e) { alert("Löschen fehlgeschlagen"); }
}
</script>
</body>
</html>
