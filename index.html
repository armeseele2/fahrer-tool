<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Springer-Dispo 6.0</title>

<style>
:root{
--blue:#0d6efd;
--green:#198754;
--red:#dc3545;
--gray:#6c757d;
--bg:#f3f6fa;
--card:#ffffff;
}

body{
font-family:Segoe UI,Arial,sans-serif;
background:var(--bg);
margin:0;
padding:20px;
}

.wrapper{
max-width:720px;
margin:auto;
}

.card{
background:var(--card);
padding:24px;
border-radius:14px;
box-shadow:0 6px 18px rgba(0,0,0,.08);
margin-bottom:20px;
}

h1{
margin-top:0;
font-size:28px;
color:var(--blue);
text-align:center;
}

label{
font-size:14px;
font-weight:600;
display:block;
margin-bottom:6px;
margin-top:10px;
}

input{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:8px;
box-sizing:border-box;
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

button{
border:none;
padding:14px;
border-radius:8px;
cursor:pointer;
font-weight:700;
}

.mainBtn{
background:var(--blue);
color:#fff;
width:100%;
margin-top:16px;
}

.setupBtn{
background:#eee;
width:100%;
margin-top:10px;
}

.driver{
background:#fff;
border-left:6px solid #ccc;
padding:16px;
border-radius:12px;
margin-bottom:12px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.free{border-left-color:var(--green);}
.busy{border-left-color:var(--red); background:#fff5f5;}

.badge{
padding:6px 10px;
border-radius:8px;
font-size:13px;
font-weight:700;
}

.badgeFree{
background:#d1e7dd;
color:#0f5132;
}

.badgeBusy{
background:#f8d7da;
color:#842029;
}

.small{
font-size:13px;
color:#555;
margin-top:4px;
}

.loading{
text-align:center;
padding:20px;
font-weight:700;
}
</style>
</head>

<body>
<div class="wrapper">

<div class="card">
<h1>Springer-Dispo 6.0</h1>

<label>Ziel-PLZ</label>
<input id="destPlz" value="30177">

<div class="row">
<div>
<label>Von</label>
<input type="date" id="dateFrom">
</div>
<div>
<label>Bis</label>
<input type="date" id="dateTo">
</div>
</div>

<button class="mainBtn" onclick="run()">Disposition starten</button>
<button class="setupBtn" onclick="setup()">⚙️ API Einstellungen</button>
</div>

<div id="results"></div>

</div>

<script>
const drivers = [
{name:"Türkel Tuncer",plz:"30161"},
{name:"Von Treskow Albrecht",plz:"30175"},
{name:"Otto Alexander",plz:"30173"},
{name:"Ferkau Eckart",plz:"30851"},
{name:"Ohm Lars",plz:"30559"},
{name:"Bachmeier Reinhard",plz:"30659"},
{name:"Isfahan Mozaffaey Hamid",plz:"30519"},
{name:"Schrader Harald",plz:"30880"},
{name:"Aschenbach André",plz:"30989"},
{name:"Neubauer Michael",plz:"30853"}
];

document.getElementById("dateFrom").value = today();
document.getElementById("dateTo").value = today();

function today(){
const d=new Date();
return d.toISOString().split("T")[0];
}

function setup(){
localStorage.setItem("kKey",prompt("Kalender.digital API Key",localStorage.getItem("kKey")||""));
localStorage.setItem("gKey",prompt("Google API Key",localStorage.getItem("gKey")||""));
alert("Gespeichert.");
}

async function run(){

const results=document.getElementById("results");
results.innerHTML='<div class="card loading">Lade Kalenderdaten...</div>';

const kKey=localStorage.getItem("kKey");
const gKey=localStorage.getItem("gKey");

if(!kKey){
alert("Bitte API Daten eingeben.");
return;
}

const from=document.getElementById("dateFrom").value;
const to=document.getElementById("dateTo").value;
const plz=document.getElementById("destPlz").value;

try{

/* ===========================
   KALENDER LADEN
=========================== */

const url=`https://api.kalender.digital/public/event?startDate=${from}&endDate=${to}&timeZone=Europe/Berlin`;
const proxy=`https://corsproxy.io/?${encodeURIComponent(url)}`;

const resp=await fetch(proxy,{
method:"GET",
headers:{
"X-API-KEY":kKey.trim()
}
});

if(!resp.ok) throw new Error("Kalender API Fehler");

const events=await resp.json();

console.log("Kalender Events:",events);

/* ===========================
   GOOGLE MAPS LADEN
=========================== */

if(typeof google==="undefined"){
await loadGoogle(gKey);
}

const matrix = await getDistances(plz);

/* ===========================
   AUSWERTUNG
=========================== */

let ranking = drivers.map((driver,index)=>{

const busy = isDriverBusy(driver,events);

return{
...driver,
busy:busy,
distanceText:matrix.rows[index].elements[0].distance.text,
distanceVal:matrix.rows[index].elements[0].distance.value
};

});

ranking.sort((a,b)=>
(a.busy - b.busy) || (a.distanceVal - b.distanceVal)
);

render(ranking);

}catch(err){
results.innerHTML=`<div class="card">Fehler: ${err.message}</div>`;
}

}

/* ===========================
   FAHRER BELEGT?
=========================== */

function isDriverBusy(driver,events){

const full=driver.name.toLowerCase();
const last=driver.name.split(" ").pop().toLowerCase();

return events.some(ev=>{

const title=(ev.title||"").toLowerCase();
const desc=(ev.description||"").toLowerCase();

let sub="";

if(Array.isArray(ev.subCalendars)){
sub=ev.subCalendars.join(" ").toLowerCase();
}

return (
title.includes(full) ||
title.includes(last) ||
desc.includes(full) ||
desc.includes(last) ||
sub.includes(full) ||
sub.includes(last)
);

});

}

/* ===========================
   GOOGLE DISTANZEN
=========================== */

function loadGoogle(key){
return new Promise(resolve=>{
const s=document.createElement("script");
s.src=`https://maps.googleapis.com/maps/api/js?key=${key}`;
s.onload=resolve;
document.head.appendChild(s);
});
}

function getDistances(dest){
return new Promise(resolve=>{

const service=new google.maps.DistanceMatrixService();

service.getDistanceMatrix({
origins:drivers.map(d=>d.plz),
destinations:[dest],
travelMode:"DRIVING"
},(response,status)=>{
resolve(response);
});

});
}

/* ===========================
   RENDER
=========================== */

function render(list){

const results=document.getElementById("results");

results.innerHTML=list.map(d=>`
<div class="driver ${d.busy?'busy':'free'}">

<div>
<strong>${d.name}</strong>
<div class="small">${d.distanceText} entfernt</div>
<div class="small">${d.plz}</div>
</div>

<div>
<span class="badge ${d.busy?'badgeBusy':'badgeFree'}">
${d.busy?'BESETZT':'FREI'}
</span>
</div>

</div>
`).join("");

}
</script>
</body>
</html>
