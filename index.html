<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Springer-Dispo 12.0 (Final)</title>
    <style>
        :root { --p: #007bff; --s: #28a745; --d: #dc3545; --bg: #f4f7f6; }
        body { font-family: sans-serif; background: var(--bg); padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 15px; }
        .btn-main { width: 100%; padding: 16px; background: var(--p); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .log-box { background: #000; color: #0f0; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 0.8rem; margin-bottom: 20px; min-height: 50px; }
        .driver { background: white; padding: 12px; border-radius: 10px; margin-top: 8px; display: flex; justify-content: space-between; border-left: 6px solid #ccc; }
        .is-busy { border-left-color: var(--d); background: #fff5f5; }
        .is-free { border-left-color: var(--s); }
    </style>
</head>
<body>

<div class="card">
    <h2 style="text-align:center; color:var(--p);">Springer-Dispo 12.0</h2>
    <div id="statusLog" class="log-box">Bereit für den privaten Tunnel.</div>

    <label>Ziel-PLZ</label>
    <input type="text" id="destPlz" value="30177">
    <label>Datum</label>
    <input type="date" id="targetDate" value="2026-04-24">

    <button class="btn-main" onclick="run()">Abfrage über eigenen Server starten</button>
    <p style="text-align:center;"><a href="#" onclick="setup()">⚙️ Keys & Tunnel-URL einstellen</a></p>
</div>

<div id="results" style="max-width: 600px; margin: 20px auto;"></div>

<script>
    const drivers = [
        { name: "Türkel Tuncer", plz: "30161" }, { name: "Von Treskow Albrecht", plz: "30175" },
        { name: "Otto Alexander", plz: "30173" }, { name: "Ferkau Eckart", plz: "30851" },
        { name: "Ohm Lars", plz: "30559" }, { name: "Bachmeier Reinhard", plz: "30659" },
        { name: "Isfahan Mozaffaey Hamid", plz: "30519" }, { name: "Schrader Harald", plz: "30880" }
    ];

    function setup() {
        localStorage.setItem('kKey', prompt("X-API-KEY:", localStorage.getItem('kKey') || ""));
        localStorage.setItem('kIds', prompt("Kalender-IDs:", localStorage.getItem('kIds') || ""));
        localStorage.setItem('gKey', prompt("Google API Key:", localStorage.getItem('gKey') || ""));
        localStorage.setItem('proxyUrl', prompt("Google Web-App URL (aus Schritt 1):", localStorage.getItem('proxyUrl') || ""));
        location.reload();
    }

    async function run() {
        const kKey = localStorage.getItem('kKey'), kIds = localStorage.getItem('kIds'), proxy = localStorage.getItem('proxyUrl');
        const date = document.getElementById('targetDate').value;
        const log = document.getElementById('statusLog');
        if(!proxy) return alert("Bitte erst die Google Web-App URL im Setup eintragen!");

        log.innerHTML = "🛰️ Sende Anfrage an privaten Tunnel...";
        try {
            let allEvents = [];
            for(let id of kIds.split(',')) {
                const target = `https://api.kalender.digital/public/event?calendarId=${id.trim()}&startDate=${date}&endDate=${date}`;
                const resp = await fetch(`${proxy}?url=${encodeURIComponent(target)}&key=${kKey}`);
                const data = await resp.json();
                if(data.events) allEvents = allEvents.concat(data.events);
            }

            log.innerHTML = `✅ ${allEvents.length} Termine geladen.`;
            
            const service = new google.maps.DistanceMatrixService();
            service.getDistanceMatrix({
                origins: drivers.map(d => d.plz),
                destinations: [document.getElementById('destPlz').value],
                travelMode: 'DRIVING'
            }, (mResp, status) => {
                let ranking = drivers.map((d, i) => {
                    const lastName = d.name.split(' ').pop().toLowerCase();
                    const event = allEvents.find(ev => ev.title.toLowerCase().includes(lastName));
                    return { ...d, distT: mResp.rows[i].elements[0].distance.text, distV: mResp.rows[i].elements[0].distance.value, isBusy: !!event, eName: event ? event.title : '' };
                });
                ranking.sort((a,b) => a.isBusy - b.isBusy || a.distV - b.distV);
                document.getElementById('results').innerHTML = ranking.map(d => `
                    <div class="driver ${d.isBusy ? 'is-busy' : 'is-free'}">
                        <div><strong>${d.name} (${d.distT})</strong>${d.isBusy ? `<br><small>${d.eName}</small>` : ''}</div>
                        <span>${d.isBusy ? '🔴 BELEGT' : '🟢 FREI'}</span>
                    </div>`).join('');
            });
        } catch(e) { log.innerHTML = "❌ Fehler im Tunnel. Web-App URL korrekt?"; }
    }

    (function() {
        const key = localStorage.getItem('gKey');
        if(key) { document.write(`<script src="https://maps.googleapis.com/maps/api/js?key=${key}"><\/script>`); }
    })();
</script>
</body>
</html>
