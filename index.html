<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Springer-Dispo 5.2</title>

<style>
:root { --p:#007bff; --s:#28a745; --d:#dc3545; --bg:#f4f7f6; }

body {
font-family:Segoe UI,sans-serif;
background:var(--bg);
padding:20px;
}

.card {
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 4px 15px rgba(0,0,0,0.1);
max-width:650px;
margin:auto;
}

label{font-weight:bold;display:block;margin-top:10px;}
input,select{
width:100%;
padding:12px;
border-radius:8px;
border:1px solid #ddd;
margin-bottom:10px;
}

.btn-main{
width:100%;
padding:16px;
background:var(--p);
color:white;
border:none;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

.driver{
background:white;
padding:15px;
margin-top:10px;
border-radius:10px;
display:flex;
justify-content:space-between;
border-left:6px solid #ccc;
box-shadow:0 2px 8px rgba(0,0,0,0.05);
}

.busy{border-left-color:var(--d);background:#fff5f5;}
.free{border-left-color:var(--s);}

.status{
font-weight:bold;
padding:4px 8px;
border-radius:5px;
font-size:0.85rem;
}

.st-busy{background:#f8d7da;color:#721c24;}
.st-free{background:#d4edda;color:#155724;}
</style>
</head>

<body>

<div class="card">
<h2 style="text-align:center;">Springer-Dispo 5.2</h2>

<label>Ziel-PLZ</label>
<input id="destPlz" value="30177">

<div style="display:flex;gap:10px;">
<div style="flex:1;">
<label>Von</label>
<input type="date" id="dateFrom">
</div>
<div style="flex:1;">
<label>Bis</label>
<input type="date" id="dateTo">
</div>
</div>

<button class="btn-main" onclick="run()">Disposition starten</button>
</div>

<div id="results" style="max-width:650px;margin:20px auto;"></div>

<script>

/* =========================
   FAHRER
========================= */
const drivers = [
{ name:"Türkel Tuncer", plz:"30161" },
{ name:"Von Treskow Albrecht", plz:"30175" },
{ name:"Otto Alexander", plz:"30173" },
{ name:"Ferkau Eckart", plz:"30851" },
{ name:"Ohm Lars", plz:"30559" },
{ name:"Bachmeier Reinhard", plz:"30659" },
{ name:"Isfahan Mozaffaey Hamid", plz:"30519" },
{ name:"Schrader Harald", plz:"30880" },
{ name:"Aschenbach André", plz:"30989" },
{ name:"Neubauer Michael", plz:"30853" }
];

/* =========================
   INIT DATUM
========================= */
document.getElementById("dateFrom").value = today();
document.getElementById("dateTo").value = today();

function today(){
return new Date().toISOString().split("T")[0];
}

/* =========================
   MAIN RUN
========================= */
async function run(){

const id = localStorage.getItem("kId");
const key = localStorage.getItem("kKey");
const gKey = localStorage.getItem("gKey");

if(!id || !key){
alert("Bitte API Daten setzen!");
return;
}

const from = document.getElementById("dateFrom").value;
const to = document.getElementById("dateTo").value;
const dest = document.getElementById("destPlz").value;

const res = document.getElementById("results");
res.innerHTML="Lade Kalender...";

/* =========================
   KALENDER.DIGITAL API
========================= */

try{

const url = `https://api.kalender.digital/public/event?calendarId=${id}&startDate=${from}&endDate=${to}&timeZone=Europe/Berlin`;

const proxy = `https://corsproxy.io/?${encodeURIComponent(url)}`;

const resp = await fetch(proxy,{
headers:{
"X-API-KEY": key.trim()
}
});

if(!resp.ok) throw new Error("API Fehler " + resp.status);

const events = await resp.json();

console.log("EVENTS:", events);

/* =========================
   GOOGLE DISTANZ
========================= */

if(typeof google === "undefined"){
await loadGoogle(gKey);
}

const dist = await getDistance(dest);

/* =========================
   RANKING
========================= */

let ranking = drivers.map((d,i)=>{

return {
...d,
busy: isBusy(d, events),
distText: dist.rows[i].elements[0].distance.text,
distValue: dist.rows[i].elements[0].distance.value
};

});

ranking.sort((a,b)=>
(a.busy - b.busy) || (a.distValue - b.distValue)
);

render(ranking);

}catch(e){
res.innerHTML="Fehler: " + e.message;
}

}

/* =========================
   KORREKTE BELEGT-LOGIK
========================= */
function isBusy(driver, events){

const full = driver.name.toLowerCase();
const last = driver.name.split(" ").pop().toLowerCase();

return events.some(ev=>{

const title = (ev.title||"").toLowerCase();
const desc = (ev.description||"").toLowerCase();

const subs = Array.isArray(ev.subCalendars)
? ev.subCalendars.join(" ").toLowerCase()
: "";

return (
title.includes(full) ||
title.includes(last) ||
desc.includes(full) ||
desc.includes(last) ||
subs.includes(full) ||
subs.includes(last)
);

});

}

/* =========================
   GOOGLE
========================= */
function loadGoogle(key){
return new Promise(r=>{
const s=document.createElement("script");
s.src=`https://maps.googleapis.com/maps/api/js?key=${key}`;
s.onload=r;
document.head.appendChild(s);
});
}

function getDistance(dest){
return new Promise(r=>{
const service=new google.maps.DistanceMatrixService();
service.getDistanceMatrix({
origins:drivers.map(d=>d.plz),
destinations:[dest],
travelMode:"DRIVING"
},(res)=>r(res));
});
}

/* =========================
   UI
========================= */
function render(list){

const el=document.getElementById("results");

el.innerHTML=list.map(d=>`
<div class="driver ${d.busy?'busy':'free'}">
<div>
<strong>${d.name}</strong><br>
<small>${d.distText} entfernt</small>
</div>
<div>
<span class="status ${d.busy?'st-busy':'st-free'}">
${d.busy?'BESETZT':'FREI'}
</span>
</div>
</div>
`).join("");

}

</script>

</body>
</html>
