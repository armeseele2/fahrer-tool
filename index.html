<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Springer-Dispo Pro v43.4 FINAL</title>

<style>
:root{
--blue:#2563eb;
--blue2:#1d4ed8;
--green:#16a34a;
--green2:#15803d;
--red:#dc2626;
--bg:#eef2f7;
--card:#ffffff;
--line:#e5e7eb;
--text:#111827;
--muted:#6b7280;
}
*{box-sizing:border-box}
body{
margin:0;
padding:22px;
font-family:Segoe UI,Arial,sans-serif;
background:linear-gradient(135deg,#eef2f7,#dbeafe);
color:var(--text);
}
.card{
max-width:920px;
margin:auto;
background:rgba(255,255,255,.95);
padding:26px;
border-radius:24px;
box-shadow:0 20px 60px rgba(0,0,0,.10);
}
h2{
margin:0 0 18px;
text-align:center;
color:var(--blue);
font-size:1.8rem;
}
label{
display:block;
margin:12px 0 6px;
font-size:.92rem;
font-weight:700;
}
input,select,textarea{
width:100%;
padding:12px;
border:1px solid var(--line);
border-radius:12px;
font-size:1rem;
background:#fff;
}
input:focus,select:focus,textarea:focus{
outline:none;
border-color:var(--blue);
box-shadow:0 0 0 3px rgba(37,99,235,.10);
}
.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
}
.inline{
display:flex;
align-items:center;
gap:10px;
margin-top:10px;
}
.inline input{
width:auto;
transform:scale(1.2);
}
button{
border:none;
border-radius:12px;
cursor:pointer;
font-weight:700;
transition:.2s;
}
button:hover{transform:translateY(-1px)}
.main-btn{
width:100%;
padding:15px;
margin-top:14px;
background:linear-gradient(135deg,var(--blue),var(--blue2));
color:#fff;
font-size:1rem;
}
.setup-btn{
width:100%;
padding:12px;
margin-top:10px;
background:#f3f4f6;
}
.book-btn{
padding:10px 14px;
background:linear-gradient(135deg,var(--green),var(--green2));
color:#fff;
margin-top:8px;
}
.del-btn{
padding:10px 14px;
background:#fff;
color:var(--red);
border:1px solid #fecaca;
margin-top:8px;
}
.log{
margin-top:14px;
padding:14px;
background:#0f172a;
color:#4ade80;
font-family:Consolas,monospace;
border-radius:14px;
font-size:.85rem;
min-height:58px;
white-space:pre-wrap;
}
#results{
max-width:920px;
margin:18px auto;
}
.driver{
background:#fff;
padding:16px;
border-radius:18px;
margin-bottom:12px;
display:flex;
justify-content:space-between;
gap:15px;
align-items:center;
box-shadow:0 8px 20px rgba(0,0,0,.06);
border-left:8px solid #d1d5db;
}
.driver.free{border-left-color:var(--green)}
.driver.busy{
border-left-color:var(--red);
background:#fff7f7;
}
.state{
display:inline-block;
padding:6px 10px;
border-radius:999px;
font-size:.78rem;
font-weight:700;
color:#fff;
margin:6px 0;
}
.state.free{background:var(--green)}
.state.busy{background:var(--red)}
.small{
font-size:.86rem;
color:var(--muted);
}
.right{
min-width:110px;
text-align:right;
font-size:1.08rem;
font-weight:800;
}
.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
display:none;
justify-content:center;
align-items:center;
padding:18px;
z-index:999;
}
.modal-box{
background:#fff;
width:100%;
max-width:520px;
padding:24px;
border-radius:22px;
box-shadow:0 25px 60px rgba(0,0,0,.22);
}
.modal-actions{
display:flex;
gap:10px;
margin-top:18px;
}
.cancel-btn{
flex:1;
padding:12px;
background:#e5e7eb;
}
.save-btn{
flex:2;
padding:12px;
background:linear-gradient(135deg,var(--blue),var(--blue2));
color:#fff;
}
@media(max-width:760px){
.row{grid-template-columns:1fr}
.driver{flex-direction:column;align-items:flex-start}
.right{text-align:left}
}
</style>
</head>

<body>

</div>
</div>

</body>
</html>
