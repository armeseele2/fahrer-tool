<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Springer-Dispo 10.0 (Universal)</title>
    <style>
        :root { --p: #007bff; --s: #28a745; --d: #dc3545; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); padding: 20px; color: #333; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        h2 { text-align: center; color: var(--p); margin-top: 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.85rem; color: #666; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 15px; box-sizing: border-box; font-size: 1rem; }
        .btn-main { width: 100%; padding: 16px; background: var(--p); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1.1rem; transition: background 0.3s; }
        .btn-main:hover { background: #0056b3; }
        .log-box { background: #000; color: #0f0; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 0.8rem; margin-bottom: 20px; min-height: 50px; white-space: pre-wrap; border: 1px solid #333; }
        .driver { background: white; padding: 12px; border-radius: 10px; margin-top: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 6px solid #ccc; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .is-busy { border-left-color: var(--d); background: #fff5f5; }
        .is-free { border-left-color: var(--s); }
        .setup-area { text-align: center; margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px; }
        .setup-area a { color: #888; text-decoration: none; font-size: 0.8rem; border: 1px solid #ddd; padding: 5px 10px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Springer-Dispo 10.0</h2>
    <div id="statusLog" class="log-box">Bereit für browserunabhängigen Scan.</div>

    <label>Einrichtung wählen</label>
    <select id="schoolSelect" onchange="document.getElementById('destPlz').value = this.value">
        <option value="30655">Albert-Liebmann-Schule (30655)</option>
        <option value="30165">Lebenshilfe Büttnerstraße (30165)</option>
        <option value="30449">Wilhelm-Schade-Schule (30449)</option>
        <option value="30853">Pestalozzi-Schule (30853)</option>
        <option value="30880">Mecklenheide Forst (30880)</option>
    </select>

    <label>Ziel-PLZ</label>
    <input type="text" id="destPlz" value="30655">

    <div style="display:flex; gap:10px;">
        <div style="flex:1;"><label>Von</label><input type="date" id="dateFrom" value="2026-04-24"></div>
        <div style="flex:1;"><label>Bis</label><input type="date" id="dateTo" value="2026-04-24"></div>
    </div>

    <button class="btn-main" onclick="run()">Verfügbarkeit & Ranking prüfen</button>

    <div class="setup-area">
        <a href="#" onclick="setup()">⚙️ Keys & IDs konfigurieren</a>
    </div>
</div>

<div id="results" style="max-width: 600px; margin: 20px auto;"></div>

<script>
    const drivers = [
        { name: "Türkel Tuncer", plz: "30161" }, { name: "Von Treskow Albrecht", plz: "30175" },
        { name: "Otto Alexander", plz: "30173" }, { name: "Ferkau Eckart", plz: "30851" },
        { name: "Ohm Lars", plz: "30559" }, { name: "Bachmeier Reinhard", plz: "30659" },
        { name: "Isfahan Mozaffaey Hamid", plz: "30519" }, { name: "Schrader Harald", plz: "30880" },
        { name: "Aschenbach André", plz: "30989" }, { name: "Neubauer Michael", plz: "30853" }
    ];

    function setup() {
        localStorage.setItem('kKey', prompt("X-API-KEY:", localStorage.getItem('kKey') || ""));
        localStorage.setItem('kIds', prompt("Kalender-IDs (mit Komma getrennt):", localStorage.getItem('kIds') || ""));
        localStorage.setItem('gKey', prompt("Google API Key:", localStorage.getItem('gKey') || ""));
        location.reload();
    }

    async function run() {
        const kKey = localStorage.getItem('kKey'), kIdsRaw = localStorage.getItem('kIds');
        const from = document.getElementById('dateFrom').value, to = document.getElementById('dateTo').value;
        const log = document.getElementById('statusLog');
        const resDiv = document.getElementById('results');

        if(!kKey || !kIdsRaw) return alert("Bitte erst Setup durchführen!");
        
        const idList = kIdsRaw.split(',').map(id => id.trim());
        log.innerHTML = `🌐 Verbindung über Proxy wird aufgebaut...\nScanne ${idList.length} Kalender...`;
        
        try {
            let allEvents = [];
            // Nutzt einen stabilen AllOrigins-Proxy, um CORS-Fehler zu vermeiden
            for (let id of idList) {
                const targetUrl = `https://api.kalender.digital/public/event?calendarId=${id}&startDate=${from}&endDate=${to}`;
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
                
                const resp = await fetch(proxyUrl);
                const proxyData = await resp.json();
                const data = JSON.parse(proxyData.contents); // Die eigentlichen Daten liegen im 'contents' Feld
                
                if(data.events) allEvents = allEvents.concat(data.events);
            }
            
            log.innerHTML = `✅ ${allEvents.length} Termine geladen.\nGoogle Maps Entfernungen werden berechnet...`;

            const service = new google.maps.DistanceMatrixService();
            service.getDistanceMatrix({
                origins: drivers.map(d => d.plz),
                destinations: [document.getElementById('destPlz').value],
                travelMode: 'DRIVING'
            }, (mResp, status) => {
                if(status !== 'OK') {
                    log.innerHTML = "❌ Google Maps Fehler: " + status;
                    return;
                }
                
                let ranking = drivers.map((d, i) => {
                    const lastName = d.name.split(' ').pop().toLowerCase();
                    const event = allEvents.find(ev => 
                        ev.title.toLowerCase().includes(lastName) || 
                        (ev.subCalendars && ev.subCalendars.some(sc => sc.toLowerCase().includes(lastName)))
                    );
                    const distT = mResp.rows[i].elements[0].distance.text;
                    const distV = mResp.rows[i].elements[0].distance.value;
                    return { ...d, distT, distV, isBusy: !!event, eName: event ? event.title : '' };
                });

                ranking.sort((a,b) => a.isBusy - b.isBusy || a.distV - b.distV);
                resDiv.innerHTML = "";
                ranking.forEach(d => {
                    resDiv.innerHTML += `
                        <div class="driver ${d.isBusy ? 'is-busy' : 'is-free'}">
                            <div><strong>${d.name} (${d.distT})</strong>${d.isBusy ? `<br><small style="color:var(--d)">Einsatz: ${d.eName}</small>` : ''}</div>
                            <span style="font-weight:bold">${d.isBusy ? '🔴 BELEGT' : '🟢 FREI'}</span>
                        </div>`;
                });
            });
        } catch(e) { 
            log.innerHTML = "❌ Fehler: Der Proxy-Dienst ist gerade nicht erreichbar oder die Daten sind ungültig."; 
            console.error(e);
        }
    }

    (function() {
        const key = localStorage.getItem('gKey');
        if(key) {
            const s = document.createElement('script');
            s.src = `https://maps.googleapis.com/maps/api/js?key=${key}`;
            document.head.appendChild(s);
        }
    })();
</script>
</body>
</html>
