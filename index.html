<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Springer-Dispo 7.1</title>
    <style>
        :root { --p: #007bff; --s: #28a745; --d: #dc3545; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 10px; box-sizing: border-box; }
        .btn-main { width: 100%; padding: 16px; background: var(--p); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1.1rem; }
        .log-box { background: #000; color: #0f0; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 0.8rem; margin-bottom: 15px; white-space: pre-wrap; }
        .driver { background: white; padding: 15px; border-radius: 10px; margin-top: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 6px solid #ccc; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .is-busy { border-left-color: var(--d); background: #fff5f5; }
        .is-free { border-left-color: var(--s); }
        .info { font-size: 0.75rem; color: #666; margin-top: 4px; display: block; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="text-align:center; color:var(--p); margin-top:0;">Springer-Dispo 7.1</h2>
    <div id="statusLog" class="log-box">Status: Daten bereit zur Analyse.</div>

    <label>Ziel-PLZ</label>
    <input type="text" id="destPlz" value="30655">

    <label>Datum prüfen</label>
    <input type="date" id="targetDate" value="2026-04-24">

    <button class="btn-main" onclick="run()">Verfügbarkeit prüfen</button>
    <p style="text-align:center;"><small><a href="https://cors-anywhere.herokuapp.com/corsdemo" target="_blank" style="color:red;">CORS Zugriff erneuern</a> | <a href="#" onclick="setup()">Setup</a></small></p>
</div>

<div id="results" style="max-width: 600px; margin: 20px auto;"></div>

<script>
    const drivers = [
        { name: "Türkel Tuncer", plz: "30161" }, { name: "Von Treskow Albrecht", plz: "30175" },
        { name: "Otto Alexander", plz: "30173" }, { name: "Ferkau Eckart", plz: "30851" },
        { name: "Ohm Lars", plz: "30559" }, { name: "Bachmeier Reinhard", plz: "30659" },
        { name: "Isfahan Mozaffaey Hamid", plz: "30519" }, { name: "Schrader Harald", plz: "30880" },
        { name: "Aschenbach André", plz: "30989" }, { name: "Neubauer Michael", plz: "30853" }
    ];

    function setup() {
        localStorage.setItem('kKey', prompt("X-API-KEY:"));
        localStorage.setItem('kId', prompt("ID-Liste:"));
        localStorage.setItem('gKey', prompt("Google API Key:"));
        location.reload();
    }

    async function run() {
        const kKey = localStorage.getItem('kKey'), kIdRaw = localStorage.getItem('kId');
        const date = document.getElementById('targetDate').value;
        const log = document.getElementById('statusLog');
        const resDiv = document.getElementById('results');

        if(!kKey || !kIdRaw) return alert("Bitte Setup ausfüllen!");
        
        log.innerHTML = "📡 Lade Termine...";
        let allEvents = [];
        const ids = kIdRaw.split(',').map(s => s.trim());

        try {
            for(let id of ids) {
                const url = `https://api.kalender.digital/public/event?calendarId=${id}&startDate=${date}&endDate=${date}`;
                const resp = await fetch(`https://cors-anywhere.herokuapp.com/${url}`, { headers: { 'X-API-KEY': kKey.trim() } });
                const data = await resp.json();
                if(data.events) allEvents = allEvents.concat(data.events);
            }

            log.innerHTML = `✅ ${allEvents.length} Termine gefunden.\nBerechne Google-Ranking...`;

            const service = new google.maps.DistanceMatrixService();
            service.getDistanceMatrix({
                origins: drivers.map(d => d.plz),
                destinations: [document.getElementById('destPlz').value],
                travelMode: 'DRIVING'
            }, (mResp, status) => {
                let ranking = drivers.map((d, i) => {
                    const lastName = d.name.split(' ').pop().toLowerCase();
                    // NEU: Suche gezielt im Feld subCalendars nach dem Namen
                    const event = allEvents.find(ev => 
                        ev.subCalendars && ev.subCalendars.some(sc => sc.toLowerCase().includes(lastName))
                    );
                    const dist = mResp.rows[i].elements[0].distance.text;
                    const val = mResp.rows[i].elements[0].distance.value;
                    return { ...d, distT: dist, distV: val, isBusy: !!event, eTitle: event ? event.title : '' };
                });

                ranking.sort((a,b) => a.isBusy - b.isBusy || a.distV - b.distV);
                resDiv.innerHTML = "";
                ranking.forEach(d => {
                    resDiv.innerHTML += `
                        <div class="driver ${d.isBusy ? 'is-busy' : 'is-free'}">
                            <div>
                                <strong>${d.name} (${d.distT})</strong>
                                ${d.isBusy ? `<span class="info">⚠️ ${d.eTitle}</span>` : ''}
                            </div>
                            <span style="font-weight:bold">${d.isBusy ? '🔴 BELEGT' : '🟢 FREI'}</span>
                        </div>`;
                });
            });
        } catch(e) { log.innerHTML = "❌ Fehler: " + e.message; }
    }

    (function() {
        const key = localStorage.getItem('gKey');
        if(key) {
            const s = document.createElement('script');
            s.src = `https://maps.googleapis.com/maps/api/js?key=${key}`;
            document.head.appendChild(s);
        }
    })();
</script>
</body>
</html>
