<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Springer-Dispo 7.2</title>
    <style>
        :root { --p: #007bff; --s: #28a745; --d: #dc3545; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); padding: 20px; color: #333; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; color: #555; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 15px; box-sizing: border-box; font-size: 1rem; }
        .btn-main { width: 100%; padding: 16px; background: var(--p); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1.1rem; transition: background 0.2s; }
        .btn-main:hover { background: #0056b3; }
        .log-box { background: #000; color: #0f0; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 0.8rem; margin-bottom: 20px; white-space: pre-wrap; min-height: 60px; border: 2px solid #333; }
        .driver { background: white; padding: 15px; border-radius: 10px; margin-top: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 6px solid #ccc; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .is-busy { border-left-color: var(--d); background: #fff5f5; }
        .is-free { border-left-color: var(--s); }
        .info-sub { font-size: 0.75rem; color: #666; display: block; margin-top: 4px; }
        .setup-link { text-align: center; margin-top: 15px; font-size: 0.85rem; }
        .setup-link a { color: #666; text-decoration: none; margin: 0 10px; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="text-align:center; color:var(--p); margin-top:0;">Springer-Dispo 7.2</h2>
    
    <div id="statusLog" class="log-box">Status: Bereit.</div>

    <label>Ziel-Einrichtung (PLZ)</label>
    <input type="text" id="destPlz" placeholder="z.B. 30655" value="30655">

    <div style="display:flex; gap:10px;">
        <div style="flex:1;">
            <label>Von</label>
            <input type="date" id="dateFrom" value="2026-04-24">
        </div>
        <div style="flex:1;">
            <label>Bis</label>
            <input type="date" id="dateTo" value="2026-04-24">
        </div>
    </div>

    <button class="btn-main" onclick="run()">Verfügbarkeit prüfen</button>
    
    <div class="setup-link">
        <a href="https://cors-anywhere.herokuapp.com/corsdemo" target="_blank" style="color:var(--d); font-weight:bold;">1. PROXY AKTIVIEREN</a>
        |
        <a href="#" onclick="setup()">2. Schlüssel-Setup</a>
    </div>
</div>

<div id="results" style="max-width: 600px; margin: 20px auto;"></div>

<script>
    const drivers = [
        { name: "Türkel Tuncer", plz: "30161" }, { name: "Von Treskow Albrecht", plz: "30175" },
        { name: "Otto Alexander", plz: "30173" }, { name: "Ferkau Eckart", plz: "30851" },
        { name: "Ohm Lars", plz: "30559" }, { name: "Bachmeier Reinhard", plz: "30659" },
        { name: "Isfahan Mozaffaey Hamid", plz: "30519" }, { name: "Schrader Harald", plz: "30880" },
        { name: "Aschenbach André", plz: "30989" }, { name: "Neubauer Michael", plz: "30853" }
    ];

    function setup() {
        localStorage.setItem('kKey', prompt("X-API-KEY:", localStorage.getItem('kKey') || ""));
        localStorage.setItem('kId', prompt("ID-Liste (kommagetrennt):", localStorage.getItem('kId') || ""));
        localStorage.setItem('gKey', prompt("Google Maps API Key:", localStorage.getItem('gKey') || ""));
        location.reload();
    }

    async function run() {
        const kKey = localStorage.getItem('kKey'), kIdRaw = localStorage.getItem('kId');
        const from = document.getElementById('dateFrom').value;
        const to = document.getElementById('dateTo').value;
        const log = document.getElementById('statusLog');
        const resDiv = document.getElementById('results');

        if(!kKey || !kIdRaw) return alert("Setup unvollständig! Bitte auf 'Schlüssel-Setup' klicken.");
        
        log.innerHTML = "📡 Frage Kalender ab...";
        resDiv.innerHTML = "";
        let allEvents = [];
        const ids = kIdRaw.split(',').map(s => s.trim());

        try {
            for(let id of ids) {
                const apiUrl = `https://api.kalender.digital/public/event?calendarId=${id}&startDate=${from}&endDate=${to}`;
                const resp = await fetch(`https://cors-anywhere.herokuapp.com/${apiUrl}`, { 
                    headers: { 'X-API-KEY': kKey.trim() } 
                });
                
                const text = await resp.text();
                try {
                    const data = JSON.parse(text);
                    if(data.events) allEvents = allEvents.concat(data.events);
                } catch(e) {
                    log.innerHTML = "⚠️ Proxy-Fehler!\nBitte klicke auf den roten Link 'PROXY AKTIVIEREN' und klicke dort auf den Button.";
                    return;
                }
            }

            log.innerHTML = `✅ ${allEvents.length} Termine gefunden.\nPrüfe Entfernungen...`;

            const service = new google.maps.DistanceMatrixService();
            service.getDistanceMatrix({
                origins: drivers.map(d => d.plz),
                destinations: [document.getElementById('destPlz').value],
                travelMode: 'DRIVING'
            }, (mResp, status) => {
                if(status !== 'OK') {
                    log.innerHTML = "❌ Google Maps Fehler: " + status;
                    return;
                }

                let ranking = drivers.map((d, i) => {
                    const lastName = d.name.split(' ').pop().toLowerCase();
                    // Suche im subCalendars Feld (wie in deinen Rohdaten gesehen)
                    const event = allEvents.find(ev => 
                        ev.subCalendars && ev.subCalendars.some(sc => sc.toLowerCase().includes(lastName))
                    );
                    
                    const distElement = mResp.rows[i].elements[0];
                    const distT = distElement.status === "OK" ? distElement.distance.text : "??";
                    const distV = distElement.status === "OK" ? distElement.distance.value : 999999;

                    return { ...d, distT, distV, isBusy: !!event, eTitle: event ? event.title : '' };
                });

                ranking.sort((a,b) => a.isBusy - b.isBusy || a.distV - b.distV);
                
                ranking.forEach(d => {
                    resDiv.innerHTML += `
                        <div class="driver ${d.isBusy ? 'is-busy' : 'is-free'}">
                            <div>
                                <strong>${d.name} (${d.distT})</strong>
                                ${d.isBusy ? `<span class="info-sub">Einsatz: ${d.eTitle}</span>` : ''}
                            </div>
                            <span style="font-weight:bold">${d.isBusy ? '🔴 BELEGT' : '🟢 FREI'}</span>
                        </div>`;
                });
            });
        } catch(e) { log.innerHTML = "❌ Fehler: " + e.message; }
    }

    (function() {
        const key = localStorage.getItem('gKey');
        if(key) {
            const s = document.createElement('script');
            s.src = `https://maps.googleapis.com/maps/api/js?key=${key}`;
            document.head.appendChild(s);
        }
    })();
</script>
</body>
</html>
