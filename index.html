<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Springer-Dispo 6.6</title>
    <style>
        :root { --p: #007bff; --s: #28a745; --d: #dc3545; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 10px; }
        .btn-main { width: 100%; padding: 16px; background: var(--p); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .log-box { background: #000; color: #0f0; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 0.8rem; margin-bottom: 15px; white-space: pre-wrap; }
        .driver { background: white; padding: 15px; border-radius: 10px; margin-top: 10px; display: flex; justify-content: space-between; border-left: 6px solid #ccc; }
        .is-busy { border-left-color: var(--d); background: #fff5f5; }
        .is-free { border-left-color: var(--s); }
    </style>
</head>
<body>

<div class="card">
    <h2 style="text-align:center; color:var(--p);">Springer-Dispo 6.6</h2>
    <div id="statusLog" class="log-box">Bereit. Bitte "Zugriff aktivieren" falls nötig.</div>

    <label>Ziel auswählen</label>
    <select id="schoolSelect" onchange="document.getElementById('destPlz').value = this.value">
        <option value="30655">Albert-Liebmann-Schule (30655)</option>
        <option value="30177">Test-Standort (30177)</option>
    </select>
    <input type="text" id="destPlz" value="30655">

    <div style="display:flex; gap:10px;">
        <input type="date" id="dateFrom" value="2026-04-24">
        <input type="date" id="dateTo" value="2026-04-24">
    </div>

    <button class="btn-main" onclick="run()">Verfügbarkeit prüfen</button>
    <p style="text-align:center;"><small><a href="https://cors-anywhere.herokuapp.com/corsdemo" target="_blank" style="color:red;">1. HIER KLICKEN (Zugriff aktivieren)</a> | <a href="#" onclick="setup()">2. Keys einstellen</a></small></p>
</div>

<div id="results" style="max-width: 600px; margin: 20px auto;"></div>

<script>
    const drivers = [
        { name: "Türkel Tuncer", plz: "30161" }, { name: "Von Treskow Albrecht", plz: "30175" },
        { name: "Otto Alexander", plz: "30173" }, { name: "Ferkau Eckart", plz: "30851" },
        { name: "Ohm Lars", plz: "30559" }, { name: "Bachmeier Reinhard", plz: "30659" },
        { name: "Isfahan Mozaffaey Hamid", plz: "30519" }, { name: "Schrader Harald", plz: "30880" },
        { name: "Aschenbach André", plz: "30989" }, { name: "Neubauer Michael", plz: "30853" }
    ];

    function setup() {
        localStorage.setItem('kKey', prompt("X-API-KEY:"));
        localStorage.setItem('kId', prompt("Kalender-ID (eine Haupt-ID):"));
        localStorage.setItem('gKey', prompt("Google API Key:"));
        location.reload();
    }

    async function run() {
        const kKey = localStorage.getItem('kKey'), kId = localStorage.getItem('kId'), gKey = localStorage.getItem('gKey');
        const from = document.getElementById('dateFrom').value, to = document.getElementById('dateTo').value;
        const log = document.getElementById('statusLog');
        if(!kKey || !kId) return alert("Keys fehlen!");

        log.innerHTML = "📡 Frage API an...";

        try {
            // Wir erzwingen wieder die calendarId, da die Abfrage ohne ID in V6.3 leer blieb
            const apiUrl = `https://api.kalender.digital/public/event?calendarId=${kId}&startDate=${from}&endDate=${to}&includeSubcalendars=1`;
            const proxyUrl = `https://cors-anywhere.herokuapp.com/${apiUrl}`;
            
            const resp = await fetch(proxyUrl, {
                headers: { 'X-API-KEY': kKey.trim(), 'Origin': window.location.origin }
            });

            if(resp.status === 403) {
                log.innerHTML = "❌ ZUGRIFF BLOCKIERT!\nBitte klicke oben auf den roten Link 'Zugriff aktivieren' und drücke danach nochmal den Button.";
                return;
            }

            const data = await resp.json();
            const events = data.events || [];
            log.innerHTML = `✅ ${events.length} Termine geladen.\nStarte Google-Ranking...`;

            const service = new google.maps.DistanceMatrixService();
            service.getDistanceMatrix({
                origins: drivers.map(d => d.plz),
                destinations: [document.getElementById('destPlz').value],
                travelMode: 'DRIVING'
            }, (mResp, status) => {
                let ranking = drivers.map((d, i) => {
                    const lastName = d.name.split(' ').pop().toLowerCase();
                    const isBusy = events.some(ev => JSON.stringify(ev).toLowerCase().includes(lastName));
                    const dist = mResp.rows[i].elements[0].distance.text;
                    return { ...d, distT: dist, isBusy };
                });

                ranking.sort((a,b) => a.isBusy - b.isBusy);
                const resDiv = document.getElementById('results');
                resDiv.innerHTML = "";
                ranking.forEach(d => {
                    resDiv.innerHTML += `<div class="driver ${d.isBusy ? 'is-busy' : 'is-free'}">
                        <strong>${d.name} (${d.distT})</strong>
                        <span>${d.isBusy ? '🔴 BESETZT' : '🟢 FREI'}</span>
                    </div>`;
                });
            });
        } catch(e) { log.innerHTML = "❌ Fehler: " + e.message; }
    }

    (function() {
        const key = localStorage.getItem('gKey');
        if(key) {
            const s = document.createElement('script');
            s.src = `https://maps.googleapis.com/maps/api/js?key=${key}`;
            document.head.appendChild(s);
        }
    })();
</script>
</body>
</html>
