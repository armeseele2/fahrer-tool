<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>Springer-Dispo 15.9</title>
    <style>
        :root { --blue:#007bff; --green:#28a745; --red:#dc3545; --bg:#f4f7f6; }
        body { margin:0; padding:15px; background:var(--bg); font-family:Segoe UI,sans-serif; color:#333; }
        .card { max-width:600px; margin:auto; background:#fff; padding:20px; border-radius:14px; box-shadow:0 4px 18px rgba(0,0,0,.08); }
        h2 { margin:0 0 15px 0; text-align:center; color:var(--blue); font-size: 20px; }
        label { display:block; margin:10px 0 4px; font-weight:700; font-size:.85rem; color:#666; }
        input, select { width:100%; padding:10px; border:1px solid #ddd; border-radius:8px; box-sizing:border-box; font-size:16px; }
        .row { display:flex; gap:10px; }
        .row>div { flex:1; }
        button { border:none; border-radius:8px; cursor:pointer; font-weight:700; transition: 0.2s; }
        .main-btn { width:100%; padding:14px; margin-top:14px; background:var(--blue); color:#fff; font-size:1rem; }
        .main-btn:active { transform: scale(0.98); }
        .setup-btn { width:100%; margin-top:10px; padding:8px; background:#eee; font-size: 12px; }
        .log { margin-top:14px; background:#111; color:#0f0; padding:10px; border-radius:8px; font-family:monospace; font-size:.75rem; min-height:40px; }
        
        /* Fahrer Liste */
        #results { max-width:600px; margin:15px auto; }
        .driver { background:#fff; padding:15px; border-radius:12px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; border-left:8px solid #ccc; box-shadow:0 2px 8px rgba(0,0,0,.05); }
        .free { border-left-color:var(--green); background:#fafffa; }
        .busy { border-left-color:var(--red); background:#fff5f5; }
        .driver-name { font-weight: bold; font-size: 16px; margin-bottom: 2px; }
        .driver-sub { font-size: 12px; color: #666; }
        .state { display:inline-block; padding:4px 8px; border-radius:6px; font-size:.75rem; font-weight:700; color:#fff; margin: 5px 0; }
        .state.free { background:var(--green); }
        .state.busy { background:var(--red); }
        .book-btn { background:var(--green); color:#fff; padding:8px 15px; margin-top:5px; }
        .del-btn { background:#fff; color:var(--red); border:1px solid var(--red); padding:6px 12px; font-size: 0.75rem; margin-top:5px; }
        .dist-info { text-align:right; font-weight:bold; color:var(--blue); font-size: 16px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Springer-Dispo 15.9</h2>
    <label>Einrichtung / Ziel</label>
    <select id="schoolSelect" onchange="document.getElementById('destPlz').value=this.value">
        <option value="30655">Albert-Liebmann-Schule (30655)</option>
        <option value="30165">Lebenshilfe Büttnerstraße (30165)</option>
        <option value="30900">Kindergarten Domino (30900)</option>
        <option value="30419">Kindergarten - Forst Mecklenheide (30419)</option>
        <option value="30880">Freie Martinschule (30880)</option>
        <option value="30851">Kindergarten Langenhagen (30851)</option>
        <option value="30629">Kindergarten Misburg (30629)</option>
        <option value="31535">Michael-Ende-Schule (31535)</option>
        <option value="31515">Paul-Moor-Schule (31515)</option>
        <option value="30938">Pestalozzi-Schule (30938)</option>
        <option value="31303">Grundschule Otze (31303)</option>
        <option value="31303">Schule am Wasserwerk (31303)</option>
        <option value="31319">Schule im Großen Freien (31319)</option>
        <option value="30900">Unter den Eichen/BOS (30900)</option>
        <option value="30179">Stötzner-Schule (30179)</option>
        <option value="30449">Wilhelm-Schade-Schule (30449)</option>
        <option value="30559">Bildungszentrum f. Taubblinde (30559)</option>
        <option value="30900">GS Bissendorf/ Brelingen (30900)</option>
        <option value="30855">Adolf-Reichwein-Schule (30855)</option>
        <option value="30982">Calenberger Schule (30982)</option>
        <option value="30938">Kindergarten Craney (30938)</option>
        <option value="30890">Bert-Brecht-Schule (30890)</option>
        <option value="30853">Gutzmann Schule (30853)</option>
        <option value="30926">Anne Frank Schule (30926)</option>
    </select>

    <label>Ziel-PLZ</label>
    <input id="destPlz" value="30655">

    <div class="row">
        <div><label>Von</label><input type="date" id="dateFrom" value="2026-04-24"></div>
        <div><label>Bis</label><input type="date" id="dateTo" value="2026-04-24"></div>
    </div>

    <div style="margin:15px 0; display:flex; align-items:center; gap:8px;">
        <input type="checkbox" id="wholeDay" checked onchange="document.getElementById('timeBox').style.display=this.checked?'none':'flex'" style="width:auto;">
        <label for="wholeDay" style="margin:0;">Ganztägig buchen</label>
    </div>

    <div class="row" id="timeBox" style="display:none;">
        <div><label>Start</label><input type="time" id="startTime" value="07:00"></div>
        <div><label>Ende</label><input type="time" id="endTime" value="13:00"></div>
    </div>

    <label>Tour Info</label>
    <input id="desc" placeholder="z.B. Tour 27">

    <button class="main-btn" onclick="run()">VERFÜGBARKEIT PRÜFEN</button>
    <button class="setup-btn" onclick="setup()">⚙️ Setup (Keys / IDs)</button>
    <div id="log" class="log">Bereit.</div>
</div>

<div id="results"></div>

<script>
const drivers = [
    {name:"Aschenbach André", plz:"30989"}, {name:"Ohm Lars", plz:"30559"}, {name:"Bachmeier Reinhard", plz:"30659"},
    {name:"Isfahan Mozaffaey Hamid", plz:"30519"}, {name:"Otto Alexander", plz:"30173"}, {name:"Türkel Tuncer", plz:"30161"},
    {name:"Schrader Harald", plz:"30880"}, {name:"Neubauer Michael", plz:"30853"}, {name:"Ferkau Eckart", plz:"30851"},
    {name:"Bethmann Ekkehard", plz:"31535"}, {name:"Hauer Frank", plz:"30900"}, {name:"Kruse Jens Roland", plz:"31275"},
    {name:"Grimpe Dirk", plz:"30827"}, {name:"Häge Klaus Dieter", plz:"30519"}, {name:"Von Treskow Albrecht", plz:"30659"},
    {name:"Caruso Guiseppe", plz:"30880"}, {name:"Popescu Viorel", plz:"30827"}, {name:"Beka Jonel", plz:"31275"}
];

let loadedEvents=[];

function setup(){
    localStorage.setItem("kKey",prompt("Key:",localStorage.getItem("kKey")||""));
    localStorage.setItem("kIds",prompt("IDs:",localStorage.getItem("kIds")||""));
    localStorage.setItem("gKey",prompt("Google:",localStorage.getItem("gKey")||""));
    location.reload();
}

function log(t){ document.getElementById("log").textContent=t; }

async function run(){
    try{
        const kKey=localStorage.getItem("kKey"), kIds=localStorage.getItem("kIds"), gKey=localStorage.getItem("gKey");
        if(!kKey||!kIds||!gKey) return alert("Setup fehlt");
        log("📅 Lade Kalender...");
        loadedEvents=await loadEvents(document.getElementById("dateFrom").value, document.getElementById("dateTo").value, kIds, kKey);
        log("🗺️ Google Maps...");
        await loadGoogle(gKey);
        const matrix=await getDistances(document.getElementById("destPlz").value);
        let ranking=drivers.map((d,i)=>{
            const hit=isBusy(d.name,loadedEvents);
            return{ ...d, busy:hit.busy, reason:hit.reason, eventId:hit.eventId, distText:matrix.rows[i].elements[0].distance.text, distVal:matrix.rows[i].elements[0].distance.value };
        });
        ranking.sort((a,b)=>(a.busy-b.busy)||(a.distVal-b.distVal));
        render(ranking);
        log("✅ Analyse fertig.");
    }catch(e){ log("❌ "+e.message); }
}

async function loadEvents(from,to,kIds,kKey){
    let all=[];
    for(const id of kIds.split(",")){
        const url=`https://api.kalender.digital/public/event?calendarId=${id.trim()}&startDate=${from}&endDate=${to}T23:59:59`;
        const r=await fetch("https://corsproxy.io/?"+encodeURIComponent(url),{headers:{"X-API-KEY":kKey}});
        const data=await r.json();
        if(Array.isArray(data)) all.push(...data); else if(data.events) all.push(...data.events);
    }
    return all;
}

function isBusy(name,events){
    const s = name.toLowerCase().trim();
    const ln = s.split(" ").pop();
    for(const ev of events){
        let txt = (ev.title + " " + (ev.description||"")).toLowerCase();
        if(txt.includes(s) || (ln && txt.includes(ln))) return { busy:true, reason:ev.title||"Belegt", eventId:ev.id };
    }
    return { busy:false, reason:"", eventId: null };
}

function loadGoogle(key){
    return new Promise(resolve=>{
        if(typeof google!=="undefined") return resolve();
        const s=document.createElement("script"); s.src=`https://maps.googleapis.com/maps/api/js?key=${key}`; s.onload=resolve; document.head.appendChild(s);
    });
}

function getDistances(dest){
    return new Promise((resolve,reject)=>{
        new google.maps.DistanceMatrixService().getDistanceMatrix({ origins:drivers.map(d=>d.plz), destinations:[dest], travelMode:"DRIVING" },(res,status)=>status!=="OK"?reject():resolve(res));
    });
}

function render(list){
    document.getElementById("results").innerHTML=list.map(d=>`
        <div class="driver ${d.busy?'busy':'free'}">
            <div>
                <div class="driver-name">${d.name}</div>
                <div class="driver-sub">${d.plz} • ${d.distText} entfernt</div>
                <span class="state ${d.busy?'busy':'free'}">${d.busy?'BESETZT':'FREI'}</span><br>
                ${d.busy ? `<small>${d.reason}</small><br><button class="del-btn" onclick="deleteEvent('${d.eventId}','${d.name}')">🗑️ Löschen</button>` 
                         : `<button class="book-btn" onclick="book('${d.name}')">BUCHEN</button>`}
            </div>
            <div class="dist-info">${d.distText}</div>
        </div>
    `).join("");
}

async function book(driver){
    try {
        const kKey=localStorage.getItem("kKey");
        const from=document.getElementById("dateFrom").value, to=document.getElementById("dateTo").value, whole=document.getElementById("wholeDay").checked;
        let payload={ startDate: whole?from+" 00:00:00":from+" "+document.getElementById("startTime").value+":00", endDate: whole?to+" 23:59:59":to+" "+document.getElementById("endTime").value+":00", title:document.getElementById("schoolSelect").selectedOptions[0].text, description:document.getElementById("desc").value, wholeDay:whole, subCalendars:[driver] };
        const r=await fetch("https://corsproxy.io/?"+encodeURIComponent("https://api.kalender.digital/public/event"),{ method:"POST", headers:{"Content-Type":"application/json","X-API-KEY":kKey}, body:JSON.stringify(payload) });
        if(r.ok) run();
    } catch(e) { alert("Fehler"); }
}

async function deleteEvent(id, name) {
    if(!confirm(name+" löschen?")) return;
    const r=await fetch("https://corsproxy.io/?"+encodeURIComponent("https://api.kalender.digital/public/event/"+id),{ method:"DELETE", headers:{"X-API-KEY":localStorage.getItem("kKey")} });
    if(r.ok) run();
}
</script>
</body>
</html>
