<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Springer-Dispo Pro v37</title>
<style>
:root{--blue:#2563eb;--green:#16a34a;--red:#dc2626;--bg:#eef2f7;}
*{box-sizing:border-box}
body{margin:0;padding:20px;font-family:sans-serif;background:var(--bg);color:#111827;}
.card{max-width:900px;margin:auto;background:#fff;padding:25px;border-radius:15px;box-shadow:0 10px 30px rgba(0,0,0,0.1);}
h2{text-align:center;color:var(--blue);margin-top:0;}
label{display:block;margin:10px 0 5px;font-weight:700;font-size:0.85rem;}
input,select,textarea{width:100%;padding:12px;border:1px solid #e5e7eb;border-radius:10px;font-size:1rem;}
.row{display:grid;grid-template-columns:1fr 1fr;gap:15px;}
.inline{display:flex;align-items:center;gap:10px;margin:15px 0;padding:10px;background:#f8fafc;border-radius:10px;}
.inline input{width:auto;}
button{border:none;border-radius:10px;cursor:pointer;font-weight:700;}
.main-btn{width:100%;padding:15px;background:var(--blue);color:#fff;font-size:1.1rem;margin-top:10px;}
#results{max-width:900px;margin:20px auto;}
.driver{background:#fff;padding:15px;border-radius:12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 10px rgba(0,0,0,0.05);border-left:10px solid #ccc;}
.free{border-left-color:var(--green);}
.busy{border-left-color:var(--red);background:#fff1f2;}
.book-btn{padding:10px 20px;background:var(--green);color:#fff;}
.del-btn{padding:8px 12px;background:#fff;color:var(--red);border:1px solid #fecaca;font-size:0.8rem;margin-top:5px;}
.log{margin-top:15px;background:#1e293b;color:#4ade80;padding:12px;border-radius:10px;font-family:monospace;font-size:0.8rem;min-height:50px;white-space:pre-wrap;}
</style>
</head>
<body>

<div class="card">
    <h2>Springer-Dispo Pro v37</h2>
    
    <label>Einrichtung / Ziel auswählen</label>
    <select id="schoolSelect" onchange="document.getElementById('destPlz').value=this.value">
        <option value="">-- Ziel wählen --</option>
        <option value="30655">Albert-Liebmann-Schule (30655)</option>
        <option value="30165">Lebenshilfe Büttnerstraße (30165)</option>
        <option value="30449">Wilhelm-Schade-Schule (30449)</option>
        <option value="30853">Pestalozzi-Schule (30853)</option>
        <option value="30880">Mecklenheide Forst (30880)</option>
        <option value="30539">Gutzmannschule (30539)</option>
        <option value="30419">Schule auf dem Gebirge (30419)</option>
        <option value="30629">Paul-Klee-Schule (30629)</option>
        <option value="30171">Leinetalschulen (30171)</option>
        <option value="30827">Schule am Storchennest (30827)</option>
        <option value="30916">Erich-Kästner-Schule (30916)</option>
    </select>
    
    <input type="hidden" id="destPlz" value="30655">

    <div class="row">
        <div><label>Von</label><input type="date" id="dateFrom" value="2026-04-24"></div>
        <div><label>Bis</label><input type="date" id="dateTo" value="2026-04-24"></div>
    </div>

    <div class="inline">
        <input type="checkbox" id="wholeDay" checked onchange="toggleTime()">
        <label for="wholeDay" style="margin:0">Ganztägig buchen</label>
    </div>

    <div class="row" id="timeBox" style="display:none">
        <div><label>Startzeit</label><input type="time" id="startTime" value="07:00"></div>
        <div><label>Endzeit</label><input type="time" id="endTime" value="13:00"></div>
    </div>

    <button class="main-btn" onclick="run()">Verfügbarkeit & Ranking prüfen</button>
    <button onclick="setup()" style="width:100%;background:none;color:gray;font-size:0.7rem;margin-top:10px;">Setup</button>
    <div id="log" class="log">Bereit.</div>
</div>

<div id="results"></div>

<div id="bookingModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:2000;justify-content:center;align-items:center;">
    <div style="background:#fff;padding:25px;border-radius:20px;width:95%;max-width:450px;">
        <h3>Termin eintragen</h3>
        <label>Fahrer</label>
        <input type="text" id="popDriver" readonly style="background:#f3f4f6">
        <div class="row">
            <div>
                <label>Wer meldet?</label>
                <select id="nameSelect" onchange="updatePopDesc()">
                    <option value="">-- Melder --</option>
                    <option value="Angela">Angela</option><option value="Anja">Anja</option>
                    <option value="Beate">Beate</option><option value="Bettina">Bettina</option>
                </select>
            </div>
            <div>
                <label>Tour</label>
                <select id="tourSelect" onchange="updatePopDesc()"><option value="">-- Tour --</option></select>
            </div>
        </div>
        <label>Beschreibung</label>
        <textarea id="popDesc" rows="2"></textarea>
        <div style="margin-top:20px;display:flex;gap:10px;">
            <button onclick="closeModal()" style="background:#eee;flex:1;padding:12px;">Abbruch</button>
            <button onclick="confirmBooking()" style="background:var(--blue);color:#fff;flex:2;padding:12px;">Eintragen</button>
        </div>
    </div>
</div>

<script>
const drivers=[
    {name:"Aschenbach André", plz:"30989"},{name:"Ohm Lars", plz:"30559"},{name:"Bachmeier Reinhard", plz:"30659"},
    {name:"Isfahan Mozaffaey Hamid", plz:"30519"},{name:"Otto Alexander", plz:"30173"},{name:"Türkel Tuncer", plz:"30161"},
    {name:"Schrader Harald", plz:"30880"},{name:"Neubauer Michael", plz:"30853"},{name:"Ferkau Eckart", plz:"30851"},
    {name:"Bethmann Ekkehard", plz:"31535"},{name:"Hauer Frank", plz:"30900"},
    {name:"Häge Klaus  Dieter", plz:"30519"}, 
    {name:"Grimpe Dirk", plz:"30827"},{name:"Moser Siegfried", plz:"30827"},{name:"Von Treskow Albrecht", plz:"30659"},
    {name:"Beka Jonel", plz:"31275"},{name:"Giuseppe Caruso", plz:"30880"},
    {name:"Popescu Viorel Florinel", plz:"30827"},
    {name:"Bodewell Thomas", plz:"30853"}
];

let loadedEvents=[];
let currentDriverForBooking = "";

window.onload=()=>{
    const ts=document.getElementById('tourSelect');
    for(let i=1;i<=40;i++){let o=document.createElement('option');o.value="Tour "+i;o.innerText="Tour "+i;ts.appendChild(o);}
};

function setup(){
    localStorage.setItem("kKey",prompt("API-Key:",localStorage.getItem("kKey")||""));
    localStorage.setItem("kIds",prompt("Kalender-ID(s):",localStorage.getItem("kIds")||""));
    localStorage.setItem("gKey",prompt("Google API Key:",localStorage.getItem("gKey")||""));
    location.reload();
}

function log(t){document.getElementById("log").textContent=t;}
function toggleTime(){document.getElementById("timeBox").style.display=document.getElementById("wholeDay").checked?"none":"grid";}

async function run(){
    try{
        const kKey=localStorage.getItem("kKey"),kIds=localStorage.getItem("kIds"),gKey=localStorage.getItem("gKey");
        if(!kKey||!kIds||!gKey)return alert("Setup fehlt!");
        log("📅 Lade Kalender...");
        loadedEvents=await loadEvents(document.getElementById("dateFrom").value,document.getElementById("dateTo").value,kIds,kKey);
        await loadGoogle(gKey);
        const matrix=await getDistances(document.getElementById("destPlz").value);
        let ranking=drivers.map((d,i)=>{
            const hit=isBusy(d.name,loadedEvents);
            return {...d,busy:hit.busy,reason:hit.reason,eventId:hit.eventId,distText:matrix.rows[i].elements[0].distance.text,distVal:matrix.rows[i].elements[0].distance.value};
        });
        ranking.sort((a,b)=>(a.busy-b.busy)||(a.distVal-a.distVal));
        render(ranking);
        log("✅ Alles bereit.");
    }catch(e){log("❌ "+e.message);}
}

async function loadEvents(from,to,kIds,kKey){
    let all=[];
    for(const id of kIds.split(",")){
        const url=`https://api.kalender.digital/public/event?calendarId=${id.trim()}&startDate=${from}&endDate=${to}T23:59:59`;
        const r=await fetch("https://corsproxy.io/?"+encodeURIComponent(url),{headers:{"X-API-KEY":kKey}});
        if(r.ok){const d=await r.json();all.push(...(d.events||d));}
    }
    return all;
}

function isBusy(fullName,events){
    const s = fullName.toLowerCase().trim();
    const lastName = s.split(" ")[0]; // Sucht nur nach "Häge" oder "Popescu"

    for(const ev of events){
        let t = (ev.title||"") + " " + (ev.description||"") + " " + (ev.subCalendars?ev.subCalendars.join(" "):"");
        t = t.toLowerCase();
        
        // Wenn der Nachname im Termin vorkommt, ist er besetzt
        if(t.includes(lastName)){
            return {busy:true, reason:ev.title, eventId:ev.id};
        }
    }
    return {busy:false};
}

function loadGoogle(key){return new Promise(resolve=>{if(typeof google!=="undefined")return resolve();const s=document.createElement("script");s.src=`https://maps.googleapis.com/maps/api/js?key=${key}`;s.onload=resolve;document.head.appendChild(s);});}
function getDistances(dest){return new Promise((resolve,reject)=>{new google.maps.DistanceMatrixService().getDistanceMatrix({origins:drivers.map(d=>d.plz),destinations:[dest],travelMode:"DRIVING"},(res,status)=>status!=="OK"?reject():resolve(res));});}

function render(list){
    document.getElementById("results").innerHTML=list.map(d=>`
    <div class="driver ${d.busy?'busy':'free'}">
        <div>
            <strong>${d.name}</strong><br>
            ${d.busy?`<span style="color:var(--red);font-weight:bold;">⚠️ BESETZT: ${d.reason}</span><br><button onclick="deleteEvent('${d.eventId}')" style="color:red;border:1px solid red;background:none;font-size:0.7rem;cursor:pointer;margin-top:5px;border-radius:5px;padding:3px 8px;">Löschen</button>`:`<button class="book-btn" onclick="openBookingModal('${d.name.replace(/'/g,"\\'")}')" style="padding:10px;background:var(--green);color:white;cursor:pointer;border:none;border-radius:8px;">BUCHEN</button>`}
        </div>
        <div style="text-align:right"><strong>${d.distText}</strong><br><small>Entfernung</small></div>
    </div>`).join("");
}

function openBookingModal(name){
    currentDriverForBooking=name;
    document.getElementById('popDriver').value=currentDriverForBooking;
    document.getElementById('bookingModal').style.display='flex';
}
function closeModal(){document.getElementById('bookingModal').style.display='none';}
function updatePopDesc(){
    const n=document.getElementById('nameSelect').value;
    const t=document.getElementById('tourSelect').value;
    document.getElementById('popDesc').value=(n?n+" meldet: ":"")+(t?t:"");
}

async function confirmBooking(){
    const driver=currentDriverForBooking;
    const desc=document.getElementById('popDesc').value;
    closeModal();
    try{
        const kKey=localStorage.getItem("kKey"),from=document.getElementById("dateFrom").value,to=document.getElementById("dateTo").value,whole=document.getElementById("wholeDay").checked,school=document.getElementById('schoolSelect').selectedOptions[0].text;
        const payload={
            startDate:whole?`${from} 00:00:00`:`${from} ${document.getElementById("startTime").value}:00`,
            endDate:whole?`${to} 23:59:59`:`${to} ${document.getElementById("endTime").value}:00`,
            timeZone:"Europe/Berlin", title:school, description:desc, wholeDay:whole, subCalendars:[driver]
        };
        log("⏳ Speichere...");
        const r=await fetch("https://corsproxy.io/?"+encodeURIComponent("https://api.kalender.digital/public/event"),{
            method:"POST",headers:{"Content-Type":"application/json","X-API-KEY":kKey},body:JSON.stringify(payload)
        });
        if(!r.ok) throw new Error("Fehler.");
        alert("✅ Eingetragen!");
        run();
    }catch(e){alert("❌ Fehler: " + e.message);log("Bereit.");}
}

async function deleteEvent(id){
    if(!confirm("Löschen?"))return;
    try{
        await fetch("https://corsproxy.io/?"+encodeURIComponent(`https://api.kalender.digital/public/event/${id}`),{method:"DELETE",headers:{"X-API-KEY":localStorage.getItem("kKey")}});
        run();
    }catch(e){alert("❌ Fehler beim Löschen");}
}
</script>
</body>
</html>
